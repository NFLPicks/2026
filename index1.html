// mortalLock shape: { gameId, slot: "spread"|"total" } | null

function countPicks(picks) {
  return Object.values(picks).reduce((acc, g) => acc + (g.spread ? 1 : 0) + (g.total ? 1 : 0), 0);
}

function flatPicks(picks) {
  // returns [{ gameId, slot, value }]
  const out = [];
  Object.entries(picks).forEach(([gid, g]) => {
    if (g.spread) out.push({ gameId: gid, slot: "spread", value: g.spread });
    if (g.total)  out.push({ gameId: gid, slot: "total",  value: g.total });
  });
  return out;
}

async function sbQuery(table, params) {
  try {
    const url = SB_URL + "/" + table + (params || "");
    const r = await fetch(url, { method: "GET", headers: SB_HEADERS });
    if (!r.ok) { console.error("sbQuery failed:", r.status, table); return null; }
    const json = await r.json();
    return json;
  } catch(e) { console.warn("sbQuery error:", table, e.message); return null; }
}

async function sbUpsert(table, data, conflict) {
  try {
    const url = SB_URL + "/" + table + (conflict ? "?on_conflict=" + encodeURIComponent(conflict) : "");
    const r = await fetch(url, {
      method: "POST",
      headers: { ...SB_HEADERS, "Prefer": "resolution=merge-duplicates,return=minimal" },
      body: JSON.stringify(data),
    });
    if (!r.ok) { const t = await r.text(); console.error("sbUpsert failed:", r.status, table, t); return false; }
    return true;
  } catch(e) { console.warn("sbUpsert error:", table, e.message); return false; }
}

async function sbUpdate(table, match, data) {
  try {
    const params = Object.entries(match).map(([k,v]) => k + "=eq." + encodeURIComponent(v)).join("&");
    const r = await fetch(SB_URL + "/" + table + "?" + params, {
      method: "PATCH",
      headers: SB_HEADERS,
      body: JSON.stringify(data),
    });
    return r.ok;
  } catch(e) { console.warn("sbUpdate error:", table, e.message); return false; }
}

async function sbDelete(table, match) {
  try {
    const params = Object.entries(match).map(([k,v]) => k + "=eq." + encodeURIComponent(v)).join("&");

}

async function fetchESPNScores(week, weekGames) {
  // Uses The Odds API scores endpoint (same provider as our lines).
  // weekGames: our internal game list for the week, used to match by team name -> our game.id
  try {
    const url = `https://api.the-odds-api.com/v4/sports/americanfootball_nfl/scores?apiKey=${ODDS_API_KEY}&daysFrom=3`;
    const res = await fetch(url);
    if (!res.ok) { console.error("Scores API error:", res.status); return []; }
    const data = await res.json();
    const games = weekGames || [];
    const out = [];
    games.forEach(game => {
      const match = data.find(g => {
        const h = (g.home_team||"").toLowerCase();
        const a = (g.away_team||"").toLowerCase();
        return (h.includes(game.home.toLowerCase()) || game.home.toLowerCase().includes(h.split(" ").pop())) &&
               (a.includes(game.away.toLowerCase()) || game.away.toLowerCase().includes(a.split(" ").pop()));
      });
      if (!match) return;
      const homeScoreObj = match.scores?.find(s => s.name === match.home_team);
      const awayScoreObj = match.scores?.find(s => s.name === match.away_team);
      out.push({
        id: game.id,
        homeScore: homeScoreObj ? parseInt(homeScoreObj.score, 10) : null,
        awayScore: awayScoreObj ? parseInt(awayScoreObj.score, 10) : null,
        status: match.completed ? "final" : (homeScoreObj ? "in_progress" : "scheduled"),
      });
    });
    return out;
  } catch(e) {
    console.error("fetchESPNScores failed:", e);
    return [];
  }
}

function calcResult(game, homeScore, awayScore) {
  const out = {};
  if (homeScore==null || awayScore==null) return out;
  if (game.spread) {
    const m = game.spread.match(/[-+]?[0-9]+\.?[0-9]*/);
    const val = m ? parseFloat(m[0]) : NaN;
    const favHome = game.spread.includes(game.home);
    if (!isNaN(val)) {
      const margin = homeScore - awayScore;
      const adj = favHome ? margin + val : margin - val;
      if (Math.abs(adj) < 0.01) out.spread = "push_spread";
      else if (adj > 0) out.spread = favHome ? "spread_home" : "spread_away";
      else out.spread = favHome ? "spread_away" : "spread_home";
    }
  }
  if (game.total) {
    const tv = parseFloat(game.total.replace("O/U ",""));
    if (!isNaN(tv)) {
      const sum = homeScore + awayScore;
      if (Math.abs(sum - tv) < 0.01) out.total = "push_total";
      else out.total = sum > tv ? "over" : "under";
    }
  }
  return out;
}

// Build a game ID for each game
function buildScheduleWeek(week) {
  const games = NFL_SCHEDULE[week];
  if (!games) return null;
  return games.map((g, i) => ({
    id: `w${week}g${i+1}`,
    home: g.home, away: g.away,
    homeAbbr: g.homeAbbr, awayAbbr: g.awayAbbr,
    kickoff: g.kickoff, dateLabel: g.dateLabel,
    spread: g.spread || null,  // use opening line from schedule as seed
    total: g.total || null,    // Odds API will update with current line
    status: "upcoming", homeScore: null, awayScore: null,
  }));
}

// ── Odds API ──────────────────────────────────────────────────────────────────
const ODDS_API_KEY = "293bc28ee22c199a6e2f04555b5b710f";
const ODDS_LAST_FETCH_KEY = "odds_last_fetch";

async function fetchAndCacheOdds(games, week) {
  // Only fetch once per 24 hours
  const lastFetch = await storageGet(ODDS_LAST_FETCH_KEY + "_w" + week);
  const now = Date.now();
  if (lastFetch && (now - lastFetch) < 23 * 60 * 60 * 1000) {
    console.log("Odds fresh, skipping fetch. Next in", Math.round((23*3600000-(now-lastFetch))/3600000), "hrs");
    return games;
  }

  try {
    const url = `https://api.the-odds-api.com/v4/sports/americanfootball_nfl/odds?apiKey=${ODDS_API_KEY}&regions=us&markets=spreads,totals&oddsFormat=american`;
    const res = await fetch(url);
    if (!res.ok) { console.error("Odds API error:", res.status); return games; }
    const oddsData = await res.json();

    // Match odds to our schedule by team names — skip games that have already kicked off
    const nowTs = Date.now();
    const updatedGames = games.map(game => {
      if (new Date(game.kickoff).getTime() <= nowTs) return game; // locked — line frozen
      const match = oddsData.find(o => {
        const h = o.home_team?.toLowerCase() || "";
        const a = o.away_team?.toLowerCase() || "";
        return (h.includes(game.home.toLowerCase()) || game.home.toLowerCase().includes(h.split(" ").pop())) &&
               (a.includes(game.away.toLowerCase()) || game.away.toLowerCase().includes(a.split(" ").pop()));
      });
      if (!match) return game;

      let spread = null, total = null;
      for (const bm of (match.bookmakers || [])) {
        for (const mkt of (bm.markets || [])) {
          if (mkt.key === "spreads" && !spread) {
            const homeOut = mkt.outcomes?.find(o => o.name === match.home_team);
            if (homeOut) {
              const line = homeOut.point;
              spread = line < 0 ? `${game.home} ${line}` : `${game.away} ${-line}`;
            }
          }
          if (mkt.key === "totals" && !total) {
            const over = mkt.outcomes?.find(o => o.name === "Over");
            if (over) total = `O/U ${over.point}`;
          }
        }
        if (spread && total) break;
      }
      return { ...game, spread, total };
    });

    // Cache updated games and timestamp
    await storageSet(`games_week_${week}`, updatedGames);
    await storageSet(ODDS_LAST_FETCH_KEY + "_w" + week, now);
    console.log("Odds fetched and cached for Week", week);
    return updatedGames;
  } catch(e) {
    console.error("fetchAndCacheOdds failed:", e);
    return games;
  }
}

// picks: { gameId: { spread?, total? } }
// mortalLock: { gameId, slot } | null
// results: { gameId: "spread_away"|"spread_home"|"push_spread"|"over"|"under"|"push_total" }
function scoreUser(picks, mortalLock, results) {
  let total=0;
  const breakdown={};
  Object.entries(picks).forEach(([gid,gamePick])=>{
    ["spread","total"].forEach(slot=>{
      const pick=gamePick[slot];
      if(!pick) return;
      // Support both flat string results (legacy) and {spread,total} object results
      const gameResult=results[gid];
      const res=gameResult&&typeof gameResult==="object"?gameResult[slot]:gameResult;
      if(res==null) return;
      const key=`${gid}:${slot}`;
      const isMortal=mortalLock&&mortalLock.gameId===gid&&mortalLock.slot===slot;
      const mult=isMortal?2:1;
      let pts=0;
      if(slot==="spread"&&pick===res) pts=1*mult;
      else if(slot==="total"&&pick===res) pts=1*mult;
      else if(slot==="spread"&&res==="push_spread") pts=0.5*mult;
      else if(slot==="total"&&res==="push_total") pts=0.5*mult;
      breakdown[key]=pts;
      total+=pts;
    });
  });
  return {total,breakdown};
}

function scoreUserRecord(picks, results) {
  let wins=0, losses=0, pushes=0;
  Object.entries(picks).forEach(([gid,gamePick])=>{
    ["spread","total"].forEach(slot=>{
      const pick=gamePick[slot];
      if(!pick) return;
      const gameResult=results[gid];
      const res=gameResult&&typeof gameResult==="object"?gameResult[slot]:gameResult;
      if(res==null) return;
      const isPush=(slot==="spread"&&res==="push_spread")||(slot==="total"&&res==="push_total");
      if(isPush) pushes++;
      else if(pick===res) wins++;
      else losses++;
    });
  });
  return {wins,losses,pushes};
}

function formatCountdown(ms){
  if(ms<=0) return "Kicking off now!";
  const totalSec=Math.floor(ms/1000);
  const days=Math.floor(totalSec/86400);
  const hours=Math.floor((totalSec%86400)/3600);
  const mins=Math.floor((totalSec%3600)/60);
  const secs=totalSec%60;
  if(days>0) return `${days}d ${hours}h ${mins}m`;
  if(hours>0) return `${hours}h ${mins}m ${secs}s`;
  return `${mins}m ${secs}s`;
}

function isGameLocked(game) {
  if(!game.kickoff) return false;
  try{return new Date()>=new Date(game.kickoff);}catch{return false;}
}

function pickBtnStyle(active,type,C){
  const isDarkMode = C.bg!=="#e7e6e2";
  // Active state: colored background with white text — easy to read
  // Inactive state: clearly visible bordered button
  const activeColors={
    spread:{bg:C.red,       text:"#ffffff", border:C.red},
    over:  {bg:C.green,     text:"#ffffff", border:C.green},
    under: {bg:C.blueBright,text:"#ffffff", border:C.blueBright},
  };
  const inactiveBg  = isDarkMode ? "#1e2d48" : "#eef0f6";
  const inactiveText= isDarkMode ? "#d0ddf0" : "#3a4a68";
  const inactiveBorder = isDarkMode ? "#3a4f72" : "#b0bcd8";
  const ac = activeColors[type]||activeColors.spread;
  return{
    flex:1, padding:"9px 6px", borderRadius:9, fontSize:12, fontWeight:700,
    cursor:"pointer", transition:"all 0.15s",
    background: active ? ac.bg : inactiveBg,
    color:       active ? ac.text : inactiveText,
    border:      active ? `1.5px solid ${ac.border}` : `1.5px solid ${inactiveBorder}`,
    minWidth:0,
    boxShadow:   active ? `0 2px 8px ${ac.bg}66` : "none",
  };
}


// Parse spread string and return { favored, line, awayLine, homeLine }
// e.g. "Eagles -3.5" -> { favored:"home", line:3.5, awayLine:"+3.5", homeLine:"-3.5" }
// e.g. "EVEN" -> { favored:null, line:0, awayLine:"EVEN", homeLine:"EVEN" }
function parseSpread(game){
  if(!game.spread) return null;
  const s = game.spread.trim();
  if(s.toUpperCase()==="EVEN") return {favored:null,line:0,awayLine:"EVEN",homeLine:"EVEN"};
  const match = s.match(/^(.+?)\s+([+-]?\d+\.?\d*)$/);
  if(!match) return {favored:null,line:0,awayLine:s,homeLine:s};
  const teamPart = match[1].trim();
  const lineVal = parseFloat(match[2]);
  const favoredHome = game.home.toLowerCase().includes(teamPart.toLowerCase()) ||
                      teamPart.toLowerCase().includes(game.home.toLowerCase().split(" ").pop());
  const favLine = lineVal < 0 ? lineVal : -lineVal; // favorite always negative
  const dogLine = -favLine;
  const fmt = (n) => n > 0 ? `+${n}` : `${n}`;
  return {
    favored: favoredHome ? "home" : "away",
    line: Math.abs(lineVal),
    awayLine: favoredHome ? fmt(dogLine) : fmt(favLine),
    homeLine: favoredHome ? fmt(favLine) : fmt(dogLine),
  };
}

function slotLabel(game,slot,value){
  if(!value||!game) return "";
  if(value==="spread_away"||value==="spread_home"){
    const sp=parseSpread(game);
    if(!sp) return value==="spread_away"?game.away:game.home;
    const line=value==="spread_away"?sp.awayLine:sp.homeLine;
    const team=value==="spread_away"?game.away:game.home;
    return `${team} ${line||"ATS"}`;
  }
  if(value==="over") return `OVER ${game.total?.replace("O/U ","")||""}`;
  if(value==="under") return `UNDER ${game.total?.replace("O/U ","")||""}`;
  return value;
}

// ── PIN input ─────────────────────────────────────────────────────────────────
function PinInput({value,onChange,label,length=4,C}){
  const ref=useRef();
  return(
    <div style={{marginBottom:14}}>
      <label style={{fontSize:11,color:C.muted,display:"block",marginBottom:8}}>{label}</label>
      <div style={{display:"flex",gap:8,justifyContent:"center",position:"relative"}} onClick={()=>ref.current?.focus()}>
        {Array.from({length}).map((_,i)=>(
          <div key={i} style={{
            width:length>4?38:52,height:56,
            background:C.bg,
            border:`2px solid ${value.length===i?C.red:C.border}`,

// ── Game card ─────────────────────────────────────────────────────────────────
function GameCard({game,gamePick={},onPick,disabled,C}){  // C passed from App
  const locked=isGameLocked(game);
  const effectiveDisabled=disabled||locked;
  const awayAbbr=game.awayAbbr||TEAM_ABBR[game.away];
  const homeAbbr=game.homeAbbr||TEAM_ABBR[game.home];
  const awayColor=TEAM_COLORS[awayAbbr]||"#1a2440";
  const homeColor=TEAM_COLORS[homeAbbr]||"#1a2440";
  const hasSpread=!!game.spread;
  const hasTotal=!!game.total;
  const hasPick=!!(gamePick.spread||gamePick.total);
  const isDarkMode=C.bg!=="#e7e6e2";
  const sp=parseSpread(game);

  // Card colors
  const cardBg = isDarkMode
    ? hasPick ? "#111e35" : "#111827"
    : hasPick ? "#e8eef8" : "#ffffff";
  const cardBorder = isDarkMode
    ? hasPick ? "#2a4a7a" : "#1e2d4e"
    : hasPick ? "#99b0d8" : "#d0d8e8";

  // Button styles - pill shaped
  const btnBase = {
    flex:1, padding:"11px 8px", borderRadius:50,
    fontSize:13, fontWeight:700, cursor:"pointer",
    transition:"all 0.15s", border:"2px solid",
    fontFamily:"inherit",
  };
  const spreadAwayActive = gamePick.spread==="spread_away";
  const spreadHomeActive = gamePick.spread==="spread_home";
  const overActive = gamePick.total==="over";
  const underActive = gamePick.total==="under";

  // Color scheme: away=green, home=red, over=blue, under=orange
  const COLOR_AWAY  = "#22c55e";
  const COLOR_HOME  = "#cc1d2b";
  const COLOR_OVER  = "#1e6fff";
  const COLOR_UNDER = "#f97316";

  const activeBtnStyle = (color) => ({
    ...btnBase,
    background:color,
    color:"#ffffff",
    borderColor:color,
    boxShadow:`0 2px 12px ${color}66`,
  });
  const inactiveBtnStyle = {
    ...btnBase,
    background:"transparent",
    color:isDarkMode?"#d0ddf0":"#2a3a58",
    borderColor:isDarkMode?"#3a4f72":"#b8c8e0",
  };

  return(
    <div style={{
      background:cardBg,
      border:`1px solid ${cardBorder}`,
      borderRadius:14,
      margin:"8px 14px",
      overflow:"hidden",
      opacity:locked&&!hasPick?0.6:1,
      transition:"all 0.15s",
      position:"relative",
      boxShadow:hasPick
        ? isDarkMode?"0 4px 16px rgba(30,80,180,0.2)":"0 4px 16px rgba(30,80,180,0.1)"
        : isDarkMode?"0 2px 8px rgba(0,0,0,0.3)":"0 2px 8px rgba(0,0,0,0.06)",
    }}>
      {locked&&(
        <div style={{position:"absolute",top:0,left:14,background:C.red,color:"#fff",fontSize:9,fontWeight:800,padding:"2px 8px",borderRadius:"0 0 6px 6px",letterSpacing:1}}>
          LOCKED
        </div>
      )}

      {/* Team banner */}
      <div style={{display:"flex",height:58}}>
        <div style={{
          flex:1,
          background:`linear-gradient(135deg,${awayColor}ee,${awayColor}88)`,
          display:"flex",alignItems:"center",gap:10,padding:"0 14px",
        }}>
          <TeamLogo abbr={awayAbbr} size={30}/>
          <span style={{fontWeight:800,fontSize:14,color:"#ffffff",textShadow:"0 1px 3px rgba(0,0,0,0.4)"}}>{game.away}</span>
        </div>
        <div style={{
          width:34,display:"flex",alignItems:"center",justifyContent:"center",
          background:isDarkMode?"#0d1220":"#dde5f0",
          fontSize:12,color:C.muted,fontWeight:700,flexShrink:0,
        }}>@</div>
        <div style={{
          flex:1,
          background:`linear-gradient(225deg,${homeColor}ee,${homeColor}88)`,
          display:"flex",alignItems:"center",justifyContent:"flex-end",gap:10,padding:"0 14px",
        }}>
          <span style={{fontWeight:800,fontSize:14,color:"#ffffff",textShadow:"0 1px 3px rgba(0,0,0,0.4)"}}>{game.home}</span>
          <TeamLogo abbr={homeAbbr} size={30}/>
        </div>
      </div>

      {/* Card body */}
      <div style={{padding:"12px 14px 14px"}}>
        {/* Date + spread label row */}
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
          <span style={{fontSize:11,fontWeight:700,color:isDarkMode?"#8090b0":"#6070a0",letterSpacing:0.3}}>
            {game.dateLabel?.toUpperCase()}
          </span>
          {hasPick&&!locked&&<span style={{fontSize:10,color:C.green,fontWeight:700}}>✓ PICKED</span>}
          {hasPick&&locked&&<span style={{fontSize:10,color:C.red,fontWeight:700}}>🔒 LOCKED</span>}
        </div>

        {!hasSpread&&!hasTotal&&(
          <div style={{fontSize:12,color:C.muted,fontStyle:"italic",textAlign:"center",padding:"8px 0"}}>Lines not yet available</div>
        )}

        {/* Spread */}
        {hasSpread&&(
          <div style={{marginBottom:10}}>
            <div style={{fontSize:10,fontWeight:800,color:isDarkMode?"#8090b0":"#5060a0",letterSpacing:1,marginBottom:6}}>
              SPREAD · {game.spread}
            </div>
            <div style={{display:"flex",gap:8}}>
              <button
                style={spreadAwayActive?activeBtnStyle(COLOR_AWAY):inactiveBtnStyle}
                onClick={()=>!effectiveDisabled&&onPick?.(game.id,"spread","spread_away")}
                disabled={effectiveDisabled}>
                {game.away} {sp?.awayLine||""}
              </button>
              <button
                style={spreadHomeActive?activeBtnStyle(COLOR_HOME):inactiveBtnStyle}
                onClick={()=>!effectiveDisabled&&onPick?.(game.id,"spread","spread_home")}
                disabled={effectiveDisabled}>
                {game.home} {sp?.homeLine||""}
              </button>
            </div>
          </div>
        )}

        {/* Total */}
        {hasTotal&&(
          <div>
            <div style={{fontSize:10,fontWeight:800,color:isDarkMode?"#8090b0":"#5060a0",letterSpacing:1,marginBottom:6}}>
              TOTAL · {game.total}
            </div>
            <div style={{display:"flex",gap:8}}>
              <button
                style={overActive?activeBtnStyle(COLOR_OVER):inactiveBtnStyle}
                onClick={()=>!effectiveDisabled&&onPick?.(game.id,"total","over")}
                disabled={effectiveDisabled}>
                Over {game.total?.replace("O/U ","")||""}
              </button>
              <button
                style={underActive?activeBtnStyle(COLOR_UNDER):inactiveBtnStyle}
                onClick={()=>!effectiveDisabled&&onPick?.(game.id,"total","under")}
                disabled={effectiveDisabled}>
                Under {game.total?.replace("O/U ","")||""}
              </button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

  async function loadGames(w,isCurrent=false){
    setLoadingGames(true);
    // Use hard-coded schedule if available, otherwise placeholder
    let scheduleGames = buildScheduleWeek(w) || placeholderGames(w);
    const hasHardSchedule = !!buildScheduleWeek(w);

    // Check if we have cached games with lines already
    const stored = await storageGet(`games_week_${w}`);
    let g = stored?.length ? stored : scheduleGames;

    // Merge any stored lines onto the schedule (preserves kickoff/team data)
    if(stored?.length){
      g = scheduleGames.map((sg,i) => {
        const cached = stored.find(s=>s.id===sg.id) || stored[i];
        return cached ? {...sg, spread:cached.spread||null, total:cached.total||null,
          status:cached.status||sg.status, homeScore:cached.homeScore, awayScore:cached.awayScore} : sg;
      });
    }

    // Auto-fetch odds once per day in background (don't block UI)
    setOfflineGames(false);
    if(isCurrent) setGames(g);
    setViewGames(g);
    setLoadingGames(false);

    // Fetch fresh odds in background after UI loads
    fetchAndCacheOdds(g, w).then(updated => {
      if(isCurrent) setGames(updated);
      setViewGames(updated);
    });

    return g;
  }

  async function loadStats(){
    setLoadingStats(true);
    const s=await dbGet("standings")||[];
    const allStats=[];
    for(const p of roster){
      let totalPicks=0,totalCorrect=0,totalPush=0;
      let spreadPicks=0,spreadCorrect=0,spreadPush=0;
      let ouPicks=0,ouCorrect=0,ouPush=0;
      let mlPicks=0,mlCorrect=0,mlPush=0;
      const weeklyPts=[];
      for(let w=1;w<=currentWeek;w++){
        const {picks:wPicks, mortals:wMortals}=await dbGetAllPicks(w);
        const wResults=await dbGetResults(w);
        const userPicks=wPicks[p.name];
        if(!userPicks){weeklyPts.push({week:w,pts:0});continue;}
        if(!wResults||Object.keys(wResults).length===0){weeklyPts.push({week:w,pts:0});continue;}
        const mortal=wMortals[p.name];
        let wPts=0;
        Object.entries(userPicks).forEach(([gid,gp])=>{
          ["spread","total"].forEach(slot=>{
            const pick=gp[slot]; if(!pick) return;
            const gameResult=wResults[gid]; if(gameResult==null) return;
            // Support both flat string results and {spread,total} object results
            const res=gameResult&&typeof gameResult==="object"?gameResult[slot]:gameResult;
            if(res==null) return;
            const isMortal=mortal&&mortal.gameId===gid&&mortal.slot===slot;
            const isSpread=slot==="spread", isOU=slot==="total";
            const isPush=(isSpread&&res==="push_spread")||(isOU&&res==="push_total");
            const isWin=pick===res;
            const pts=isWin?(isMortal?2:1):isPush?(isMortal?1:0.5):0;
            wPts+=pts; totalPicks++;
            if(isSpread) spreadPicks++;
            if(isOU) ouPicks++;
            if(isMortal) mlPicks++;
            if(isWin){totalCorrect++;if(isSpread)spreadCorrect++;if(isOU)ouCorrect++;if(isMortal)mlCorrect++;}
            if(isPush){totalPush++;if(isSpread)spreadPush++;if(isOU)ouPush++;if(isMortal)mlPush++;}
          });
        });
        weeklyPts.push({week:w,pts:wPts});
      }
      const standing=s.find(x=>x.name===p.name);
      allStats.push({
        name:p.name, total:standing?.total||0,
        totalPicks,totalCorrect,totalPush,
        spreadPicks,spreadCorrect,spreadPush,
        ouPicks,ouCorrect,ouPush,
        mlPicks,mlCorrect,mlPush,
        weeklyPts,
        pct:totalPicks>0?Math.round(totalCorrect/totalPicks*100):0,
        spreadPct:spreadPicks>0?Math.round(spreadCorrect/spreadPicks*100):0,
        ouPct:ouPicks>0?Math.round(ouCorrect/ouPicks*100):0,
        mlPct:mlPicks>0?Math.round(mlCorrect/mlPicks*100):0,
      });
    }
    allStats.sort((a,b)=>b.total-a.total||(b.pct||0)-(a.pct||0));
    setStatsData(allStats);
    setLoadingStats(false);
  }

    setPinError("");setPinInput("");

    const freshWeek=await dbGet("current_week")||1;
    currentWeekRef.current=freshWeek;

    const [freshStandings]=await Promise.all([
      dbGet("standings"),
    ]);
    if(freshStandings) setStandings(freshStandings);
    await loadGames(freshWeek,true);
    await loadUserPicks(selectedPlayer,freshWeek);
    // Check if results have been confirmed for this week — if so lock picks
    const published = await dbGet(`week_${freshWeek}_published`);
    setResultsLocked(!!published);
    // Load profile photo from personal storage
    setProfilePhoto(null);
    dbGetAvatar(selectedPlayer).then(p=>{ setProfilePhoto(p||null); });

    // Weekly recap: check if the previous week was published and hasn't been shown yet
    if(freshWeek>1){
      const prevWeek=freshWeek-1;
      const prevPublished=await dbGet(`week_${prevWeek}_published`);
      const alreadySeen=localStorage.getItem(`recap_seen_${selectedPlayer}_week_${prevWeek}`);
      if(prevPublished && !alreadySeen){
        const prevPicksData=await dbGetPicks(selectedPlayer,prevWeek);
        const prevResults=await dbGetResults(prevWeek);
        if(prevPicksData&&prevPicksData.picks&&prevResults){

          setWeeklyRecap({week:prevWeek,wins,losses,pushes,rank:rankIdx>=0?rankIdx+1:null,total:sorted.length,pts:weekPts});
          setShowRecap(true);
        }
      }
    }

    // Commissioner note popup — show once per player per week per note content
    const noteForWeek = await dbGet(`commissioner_note_week_${freshWeek}`);
    if(noteForWeek){
      setCommissionerNote(noteForWeek);
      setNoteInput(noteForWeek);
      const seenKey=`note_seen_${selectedPlayer}_week_${freshWeek}`;
      const seen=localStorage.getItem(seenKey);
      if(seen!==noteForWeek) setShowNoteModal(true);
    }

    setScreen("picks");
  }

  // Toggle a single slot (spread or total) on a game
  function togglePick(gameId,slot,value){
    if(pickStep!=="picking") return;
    if(viewWeek!==currentWeek) return;
    if(resultsLocked) return; // results confirmed — picks frozen
    const game=games.find(g=>g.id===gameId);
    if(!game||isGameLocked(game)) return;
    setPicks(prev=>{
      const cur={...prev};
      const gameEntry={...(cur[gameId]||{})};
      if(gameEntry[slot]===value){
        // deselect
        delete gameEntry[slot];
        if(Object.keys(gameEntry).length===0) delete cur[gameId];
        else cur[gameId]=gameEntry;
        // clear mortal if it was this slot
        if(mortalLock?.gameId===gameId&&mortalLock?.slot===slot) setMortalLock(null);
        return cur;
      }
      // check total pick count
      const total=countPicks(cur);
      const alreadyHasSlot=!!gameEntry[slot];
      if(!alreadyHasSlot&&total>=MAX_PICKS) return prev;
      gameEntry[slot]=value;
      cur[gameId]=gameEntry;
      return cur;
    });
  }

  function buildProjected(){
    let base=[...(standings||[])];
    Object.entries(allPicks).forEach(([name,userPicks])=>{
      const{total}=scoreUser(userPicks,allMortals[name],pendingResults);
      let e=base.find(s=>s.name===name);
      if(e){const wks={...e.weeks,[viewWeek]:total};e={...e,weeks:wks,total:Object.values(wks).reduce((a,b)=>a+b,0)};base=base.map(s=>s.name===name?e:s);}
      else base.push({name,weeks:{[viewWeek]:total},total});
    });
    return[...base].sort((a,b)=>b.total-a.total||((b.pct||0)-(a.pct||0)));
  }

  async function saveGameResult(gameId){
    const gameResult = pendingResults[gameId];
    if(!gameResult || (!gameResult.spread && !gameResult.total)){
      showToast("Select a result first");
      return;
    }
    // Merge into existing results using local state (avoids read-after-write lag)
    // Also merge with a fresh server read as a safety net, local state wins on conflict
    const serverResults = await dbGetResults(viewWeek) || {};
    const newResults = {...serverResults, ...results, [gameId]: gameResult};
    await dbSetResults(viewWeek, newResults);
    setResults(newResults);
    setPendingResults(newResults);

    // Re-score standings using ALL results saved so far for this week
    let newS = await dbGet("standings") || [];
    const ap = await (await dbGetAllPicks(viewWeek)).picks;
    const am = await (await dbGetAllPicks(viewWeek)).mortals;
    roster.forEach(p=>{
      const userPicks = ap[p.name];
      const {total} = userPicks ? scoreUser(userPicks, am[p.name], newResults) : {total:0};
      let e = newS.find(s=>s.name===p.name);
      if(e){ const wks={...e.weeks,[viewWeek]:total}; e.weeks=wks; e.total=Object.values(wks).reduce((a,b)=>a+b,0); }
      else newS.push({name:p.name, weeks:{[viewWeek]:total}, total});
    });
    newS.sort((a,b)=>b.total-a.total||(b.pct||0)-(a.pct||0));
    await dbSet("standings", newS);
    setStandings(newS);

    const game = viewGames.find(g=>g.id===gameId);
    showToast(`${game?game.away+" @ "+game.home:"Game"} saved ✅`);
  }

  async function confirmResults(){
    await dbSetResults(viewWeek, pendingResults);
    let newS=await dbGet("standings")||[];
    // Score players who submitted
    Object.entries(allPicks).forEach(([name,userPicks])=>{
      const{total}=scoreUser(userPicks,allMortals[name],pendingResults);
      let e=newS.find(s=>s.name===name);
      if(e){const wks={...e.weeks,[viewWeek]:total};e.weeks=wks;e.total=Object.values(wks).reduce((a,b)=>a+b,0);}
      else newS.push({name,weeks:{[viewWeek]:total},total});
    });
    // Missed week handling — add 0 for any roster player who didn't submit
    roster.forEach(p=>{
      const submitted=allPicks[p.name]!=null;
      if(!submitted){
        let e=newS.find(s=>s.name===p.name);
        if(e){if(!e.weeks[viewWeek]){const wks={...e.weeks,[viewWeek]:0};e.weeks=wks;}}
        else newS.push({name:p.name,weeks:{[viewWeek]:0},total:0});
      }
    });
    newS.sort((a,b)=>b.total-a.total||(b.pct||0)-(a.pct||0));
    await dbSet("standings",newS);
    await storageSaveNow();
    setStandings(newS);setResults(pendingResults);setAdminPreview(false);
    showToast("Results confirmed & standings updated! ✅");
  }

    async function archivePicksForWeek(w){

      const s = await dbGet("standings") || [];
      const hasScores = s.some(p=>p.weeks && p.weeks[w]!=null);
      if(!hasScores){
        console.warn(`Skipping archive for week ${w} — no standings scores found yet.`);
        return;
      }
      await sbDelete("picks", {week:w});
      console.log(`Archived (deleted) raw picks for week ${w}. Scores remain in standings.`);
    }catch(e){
      console.warn("Archive failed:", e);
    }
  }

  function autoPick5(){
    // Get unlocked games (kickoff in future)
    const now=Date.now();
    const available=games.filter(g=>{
      const ko=new Date(g.kickoff).getTime();
      return ko>now;
    });
    if(available.length===0){showToast("No upcoming games to pick!");return;}
    // Shuffle and pick exactly 5 fresh games, 1 slot each
    const shuffled=[...available].sort(()=>Math.random()-0.5);
    const chosen=shuffled.slice(0,Math.min(5,shuffled.length));
    const slots=["spread","total"];
    // Keep locked game picks, add new random picks for unlocked slots
    const lockedPicks={};
    Object.entries(picks).forEach(([gid,gp])=>{
      const game=viewGames.find(g=>g.id===gid);
      if(game&&new Date(game.kickoff).getTime()<=now) lockedPicks[gid]=gp;
    });
    const newPicks={...lockedPicks};
    for(const g of chosen){
      const slot=slots[Math.floor(Math.random()*2)];
      const val=slot==="spread"?(Math.random()<0.5?"away":"home"):(Math.random()<0.5?"over":"under");
      newPicks[g.id]={[slot]:val};
    }
    setPicks(newPicks);
    // Only clear mortal lock if its game hasn't started
    if(mortalLock){
      const mlGame=viewGames.find(g=>g.id===mortalLock.gameId);
      if(!mlGame||new Date(mlGame.kickoff).getTime()>now) setMortalLock(null);
    }
    setPickStep("picking");
    showToast("🎲 Auto-picked 5! Review and choose your Mortal Lock.");
  }

        )}
        {resultsLocked&&(
          <div style={{...S.card,padding:"10px 16px",background:C.bg,border:`1px solid ${C.red}`}}>
            <span style={{fontSize:13,color:C.red,fontWeight:700}}>🔒 Week {currentWeek} results are in — picks frozen</span>
          </div>
        )}
        {!resultsLocked&&submitted&&(
          <div style={{...S.card,padding:"10px 16px",background:C.bg,border:`1px solid ${C.green}`}}>
            <span style={{fontSize:13,color:C.green,fontWeight:700}}>✅ Week {currentWeek} picks locked in</span>
          </div>
        )}

        {viewWeek!==currentWeek&&(
          <div style={{...S.card,padding:"10px 16px",background:C.bg,border:`1px solid ${C.border}`,display:"flex",alignItems:"center",gap:8}}>
            <span style={{fontSize:16}}>👁</span>
            <div>
              <div style={{fontSize:13,color:C.silver,fontWeight:700}}>Browsing Week {viewWeek}</div>
              <div style={{fontSize:11,color:C.muted}}>{viewWeek<currentWeek?"Past week — view only":"Picks not open yet"}</div>
            </div>
          </div>
        )}

        {/* Welcome banner */}
        {viewWeek===currentWeek&&(
          <div style={{
            margin:"10px 14px 4px",
            padding:"16px 18px",
            background:C.surface,
            borderRadius:12,
            border:`1px solid ${C.border}`,
            borderLeft:`4px solid ${C.red}`,
          }}>
            <div style={{fontSize:20,fontWeight:900,color:C.silver,letterSpacing:0.5}}>
              {(()=>{
                const h=new Date().getHours();
                if(h<12) return `Good morning, ${userName}! 👋`;
                if(h<17) return `Good afternoon, ${userName}! 👋`;
                if(h<21) return `Good evening, ${userName}! 👋`;
                return `Welcome, ${userName}! 👋`;
              })()}
            </div>
            <div style={{fontSize:13,color:C.muted,marginTop:6,lineHeight:1.5}}>
              {submitted
                ? <>You're locked in for <span style={{color:C.red,fontWeight:700}}>Week {currentWeek}</span>. Check back after games kick off.</>
                : <>Make your <span style={{color:C.red,fontWeight:700}}>Week {currentWeek}</span> picks below. Choose 5 and don't forget your Mortal Lock!</>
              }
            </div>
          </div>
        )}

        {/* Kickoff countdown timer */}
        {viewWeek===currentWeek&&!submitted&&(()=>{
          const upcoming=viewGames.filter(g=>new Date(g.kickoff).getTime()>nowTick).sort((a,b)=>new Date(a.kickoff)-new Date(b.kickoff));
          if(upcoming.length===0) return null;
          const next=upcoming[0];
          const msLeft=new Date(next.kickoff).getTime()-nowTick;
          const urgent=msLeft<3600000; // under 1 hour
          return(
            <div style={{
              margin:"0 14px 4px",padding:"12px 16px",borderRadius:12,
              background:urgent?`${C.red}18`:C.surface,
              border:`1px solid ${urgent?C.red:C.border}`,
              display:"flex",alignItems:"center",justifyContent:"space-between",gap:10,
            }}>
              <div>
                <div style={{fontSize:10,fontWeight:800,color:C.muted,letterSpacing:0.5}}>NEXT KICKOFF</div>
                <div style={{fontSize:13,fontWeight:700,color:C.text}}>{next.away} @ {next.home}</div>
              </div>
              <div style={{fontSize:urgent?18:16,fontWeight:900,color:urgent?C.red:C.gold,fontVariantNumeric:"tabular-nums"}}>
                {formatCountdown(msLeft)}
              </div>
            </div>
          );
        })()}

        {/* Step 1: pick games */}
        {pickStep==="picking"&&!submitted&&(
          <>
            {loadingGames
              ?<div style={{textAlign:"center",padding:40,color:C.muted}}>
                <div style={{fontSize:28,marginBottom:8}}>⏳</div>
                <div>Loading games…</div>
              </div>
              :<>
                <div style={{display:"flex",justifyContent:"space-between",padding:"0 14px 6px"}}>
                    {allFlatPicks.length>0?(
                      <button onClick={()=>{
                        // Only clear picks for games that haven't kicked off yet
                        const now=Date.now();
                        setPicks(prev=>{
                          const kept={};
                          Object.entries(prev).forEach(([gid,gp])=>{
                            const game=viewGames.find(g=>g.id===gid);
                            if(game&&new Date(game.kickoff).getTime()<=now) kept[gid]=gp;
                          });
                          return kept;
                        });
                        // Only clear mortal lock if its game is not locked
                        if(mortalLock){
                          const mlGame=viewGames.find(g=>g.id===mortalLock.gameId);
                          if(!mlGame||new Date(mlGame.kickoff).getTime()>Date.now()) setMortalLock(null);
                        }
                      }} style={{
                        background:"transparent",border:`1px solid ${C.muted}`,color:C.muted,
                        borderRadius:8,padding:"6px 14px",fontSize:12,cursor:"pointer",fontWeight:700,letterSpacing:0.5
                      }}>✕ Clear Picks</button>
                    ):<div/>}
                    <button onClick={autoPick5} style={{
                      background:"transparent",border:`1px solid ${C.gold}`,color:C.gold,
                      borderRadius:8,padding:"6px 14px",fontSize:12,cursor:"pointer",fontWeight:700,letterSpacing:0.5
                    }}>🎲 Auto-Pick 5</button>
                  </div>
                {offlineGames&&(
                  <div style={{...S.card,background:"#1a1000",border:`1px solid ${C.gold}`,display:"flex",gap:10,alignItems:"flex-start",padding:"12px 14px"}}>
                    <span style={{fontSize:18}}>📡</span>
                    <div>
                      <div style={{fontWeight:700,color:C.gold,fontSize:13}}>ESPN data unavailable</div>
                      <div style={{fontSize:12,color:C.muted,marginTop:2}}>Showing placeholder games. Admin can refresh when lines are available.</div>
                    </div>
                  </div>
                )}
                {viewGames.map(game=>(
                  <GameCard key={game.id} game={game} gamePick={picks[game.id]||{}} onPick={togglePick} disabled={resultsLocked||(viewWeek!==currentWeek)} C={C}/>
                ))}
              </>
            }

          </>
        )}

        {/* Step 2: mortal lock */}
        {pickStep==="mortal"&&!submitted&&(
          <>
            <div style={{...S.card,background:C.bg,border:`1px solid ${C.gold}`,textAlign:"center"}}>
              <div style={{fontSize:20,marginBottom:4}}>🔒</div>
              <div style={{fontWeight:900,color:C.text,fontSize:16}}>Choose Your Mortal Lock</div>
              <div style={{fontSize:12,color:C.muted,marginTop:4}}>Worth 2 pts correct · 1 pt push · 0 if wrong</div>
            </div>
            {allFlatPicks.map(({gameId,slot,value})=>{
              const game=games.find(g=>g.id===gameId);
              if(!game) return null;
              const isSel=mortalLock?.gameId===gameId&&mortalLock?.slot===slot;
              const awayAbbr=game.awayAbbr||TEAM_ABBR[game.away];
              const homeAbbr=game.homeAbbr||TEAM_ABBR[game.home];
              const typeColor=slot==="total"?(value==="over"?C.green:C.blue):C.gold;
              // Color the selected row based on pick type
              const selColor = slot==="spread"
                ? (value==="spread_away" ? "#22c55e" : "#cc1d2b")
                : (value==="over" ? "#1e6fff" : "#f97316");

              return(
                <div key={`${gameId}:${slot}`} onClick={()=>setMortalLock(isSel?null:{gameId,slot})}
                  style={{
                    background:isSel?selColor:C.surface,
                    border:`2px solid ${isSel?selColor:C.border}`,
                    borderRadius:12,padding:"12px 16px",margin:"8px 14px",
                    cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center",
                    boxShadow:isSel?`0 4px 16px ${selColor}55`:"none",
                    transition:"all 0.15s",
                  }}>
                  <div>
                    <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:4}}>
                      <TeamLogo abbr={awayAbbr} size={20}/>
                      <span style={{fontWeight:700,fontSize:13,color:isSel?"#ffffff":C.text}}>
                        {game.away} @ {game.home}
                      </span>
                      <TeamLogo abbr={homeAbbr} size={20}/>
                    </div>
                    <div style={{fontSize:12}}>
                      <span style={{color:isSel?"rgba(255,255,255,0.75)":C.muted,marginRight:4,fontWeight:600}}>
                        {slot.toUpperCase()}:
                      </span>
                      <span style={{color:isSel?"#ffffff":selColor,fontWeight:800}}>
                        {slotLabel(game,slot,value)}
                      </span>
                    </div>
                  </div>
                  <div style={{fontSize:22,color:isSel?"#ffffff":C.muted}}>
                    {isSel?"🔒":"○"}
                  </div>
                </div>
              );
            })}
            <div style={{display:"flex",gap:8,padding:"8px 14px 0"}}>
              <button style={{...S.btn(C.surface,C.muted),border:`1px solid ${C.border}`,flex:1}} onClick={()=>setPickStep("picking")}>← Back</button>
              <button style={{...S.btn(mortalLock?C.gold:C.border,mortalLock?C.bg:C.muted),flex:2}} onClick={submitAll} disabled={!mortalLock}>Lock In Picks 🔒</button>
            </div>
          </>
        )}

        {/* Submitted recap */}
        {submitted&&(
          <>
            {pickedGames.map(game=>{
              const gp=picks[game.id]||{};
              const isMortalSpread=mortalLock?.gameId===game.id&&mortalLock?.slot==="spread";
              const isMortalTotal=mortalLock?.gameId===game.id&&mortalLock?.slot==="total";
              const gameResult=results[game.id];
              function pickOutcome(slot,pickValue){
                if(!gameResult) return null;
                const res=gameResult&&typeof gameResult==="object"?gameResult[slot]:gameResult;
                if(res==null) return null;
                const isPush=(slot==="spread"&&res==="push_spread")||(slot==="total"&&res==="push_total");
                if(isPush) return "push";
                return pickValue===res?"win":"loss";
              }
              function OutcomeBadge({outcome}){
                if(!outcome) return null;
                const cfg={
                  win:{bg:C.green,label:"✓ WIN"},
                  loss:{bg:C.red,label:"✗ LOSS"},
                  push:{bg:C.gold,label:"½ PUSH"},
                }[outcome];
                return <span style={{fontSize:10,fontWeight:900,color:"#fff",background:cfg.bg,padding:"2px 8px",borderRadius:6,marginLeft:8,letterSpacing:0.3}}>{cfg.label}</span>;
              }
              const spreadOutcome=gp.spread?pickOutcome("spread",gp.spread):null;
              const totalOutcome=gp.total?pickOutcome("total",gp.total):null;
              return(
                <div key={game.id} style={{...S.card,position:"relative"}}>
                  {(isMortalSpread||isMortalTotal)&&<div style={{position:"absolute",top:-1,right:12,background:C.gold,color:C.bg,fontSize:10,fontWeight:900,padding:"2px 10px",borderRadius:"0 0 6px 6px"}}>🔒 MORTAL LOCK</div>}
                  <div style={{fontWeight:800,marginBottom:6}}>{game.away} @ {game.home}</div>
                  <div style={{fontSize:12,color:C.muted,marginBottom:6}}>{game.dateLabel}</div>
                  {gp.spread&&<div style={{fontSize:13,color:C.gold,marginBottom:3,display:"flex",alignItems:"center"}}>Spread: {slotLabel(game,"spread",gp.spread)}{isMortalSpread?" 🔒":""}<OutcomeBadge outcome={spreadOutcome}/></div>}
                  {gp.total&&<div style={{fontSize:13,color:gp.total==="over"?C.green:C.blue,display:"flex",alignItems:"center"}}>Total: {slotLabel(game,"total",gp.total)}{isMortalTotal?" 🔒":""}<OutcomeBadge outcome={totalOutcome}/></div>}
                </div>
              );
            })}
            <div style={{padding:"8px 14px 0"}}>
              {!resultsLocked&&(
              <button style={S.btn("#1c2840",C.muted)} onClick={()=>{// Keep picks for locked games only
              const now=Date.now();
              setPicks(prev=>{
                const kept={};
                Object.entries(prev).forEach(([gid,gp])=>{
                  const game=viewGames.find(g=>g.id===gid);
                  if(game&&new Date(game.kickoff).getTime()<=now) kept[gid]=gp;
                });
                return kept;
              });
              if(mortalLock){
                const mlGame=viewGames.find(g=>g.id===mortalLock.gameId);
                if(!mlGame||new Date(mlGame.kickoff).getTime()>now) setMortalLock(null);
              }
              setSubmitted(false);setPickStep("picking");}}>
                ✏️ Change Picks (unlocked games only)
              </button>
            )}
            </div>

            {/* Full week slate — browsable even after picks are submitted */}
            <div style={{margin:"20px 14px 8px",display:"flex",alignItems:"center",gap:10}}>
              <div style={{flex:1,height:1,background:C.border}}/>
              <span style={{fontSize:11,fontWeight:800,color:C.muted,letterSpacing:1}}>ALL WEEK {currentWeek} GAMES</span>
              <div style={{flex:1,height:1,background:C.border}}/>
            </div>
            {viewGames.map(game=>(
              <GameCard key={game.id} game={game} gamePick={picks[game.id]||{}} onPick={()=>{}} disabled={true} C={C}/>
            ))}
          </>
        )}
        <div style={{textAlign:"center",padding:"16px 0 4px",fontSize:11,color:C.muted,letterSpacing:1}}>v{VERSION}</div>
        <PickProgressStrip/>
        <BottomNav active="picks"/>
        {toast&&<div style={S.toast}>{toast}</div>}
      </div>
    );
  }

  // ── STATS ────────────────────────────────────────────────────────────────
  if(screen==="stats"){
    const StatBar=({label,correct,total,push,color})=>{
      if(total===0) return null;
      const pct=Math.round(correct/total*100);
      return(
        <div style={{marginBottom:12}}>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
            <span style={{fontSize:12,color:C.muted}}>{label}</span>
            <span style={{fontSize:12,fontWeight:700,color}}>{correct}/{total} · {pct}%{push>0?` · ${push} push`:""}</span>
          </div>
          <div style={{background:C.border,borderRadius:4,height:6,overflow:"hidden"}}>
            <div style={{width:pct+"%",background:color,height:"100%",borderRadius:4}}/>
          </div>
        </div>
      );
    };
    return(
      <div style={S.app}>
        <div style={S.header}>
          <span style={S.logo}><img src={LOGO_DATA_URL} alt="NFL Pick'em" style={{height:28,width:"auto",objectFit:"contain",filter:C.bg==="#e7e6e2"?"none":"brightness(1.1)"}}/></span>
          <div style={{display:"flex",alignItems:"center",gap:6}}><ProfileBtn/><LogoutBtn/></div>
        </div>
        {loadingStats?(
          <div style={{textAlign:"center",padding:60,color:C.muted}}>
            <div style={{fontSize:13,marginTop:8}}>Building stats…</div>
          </div>
        ):statsData.length===0?(
          <div style={{textAlign:"center",padding:60,color:C.muted}}>
            <div style={{fontSize:32,marginBottom:12}}>📊</div>
            <div style={{fontSize:15,fontWeight:700,color:C.textDim,marginBottom:6}}>No stats yet</div>
            <div style={{fontSize:13}}>Stats will appear once picks are submitted and results are scored.</div>
          </div>
        ):(
          statsData.map(p=>(
            <div key={p.name} style={S.card}>
              <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14}}>
                <AvatarCircle name={p.name} photo={avatarMap[p.name]||null} size={40}/>
                <div style={{flex:1}}>
                  <div style={{fontWeight:900,fontSize:16}}>{p.name}</div>
                  <div style={{fontSize:12,color:C.muted}}>{p.totalPicks} picks · {p.total} pts</div>
                </div>
                <div style={{textAlign:"right"}}>
                  <div style={{fontSize:24,fontWeight:900,color:C.red}}>{p.pct}%</div>
                  <div style={{fontSize:10,color:C.muted}}>OVERALL</div>
                </div>
              </div>
              <StatBar label="Spread" correct={p.spreadCorrect} total={p.spreadPicks} push={p.spreadPush} color={C.red}/>
              <StatBar label="Over/Under" correct={p.ouCorrect} total={p.ouPicks} push={p.ouPush} color={C.blueBright}/>
              <StatBar label="Mortal Lock" correct={p.mlCorrect} total={p.mlPicks} push={p.mlPush} color={C.gold}/>

            </div>
          ))
        )}
        <PickProgressStrip/>
        <BottomNav active="stats"/>
        <div style={{textAlign:"center",padding:"16px 0 4px",fontSize:11,color:C.muted}}>v{VERSION}</div>
        {toast&&<div style={S.toast}>{toast}</div>}
      </div>
    );
  }

  // ── STANDINGS ────────────────────────────────────────────────────────────
  if(screen==="standings") return(
    <div style={S.app}>
      <div style={S.header}><span style={S.logo}><img src={LOGO_DATA_URL} alt="NFL Pick'em" style={{height:28,width:"auto",objectFit:"contain",filter:C.bg==="#e7e6e2"?"none":"brightness(1.1)"}}/></span><div style={{display:'flex',alignItems:'center',gap:6}}>
          <button onClick={()=>loadStandings()} style={{background:"transparent",border:`1px solid ${C.border}`,color:C.muted,borderRadius:6,padding:"4px 8px",fontSize:11,cursor:"pointer",fontWeight:700,letterSpacing:0.5}}>↻</button>
          <ProfileBtn/><LogoutBtn/></div></div>
      <div style={{padding:"10px 0"}}>
        {standings.length===0
          ?<div style={{textAlign:"center",padding:40,color:C.muted}}>No results yet.</div>
          :standings.map((s,i)=>{
            const wkPts=s.weeks?.[viewWeek]??null;
            return(
              <div key={s.name} style={{display:"flex",alignItems:"center",gap:12,padding:"12px 16px",background:i===0?C.bg==="#e7e6e2"?`${C.red}18`:C.surface:C.surface,borderRadius:10,margin:"6px 14px",border:`1px solid ${i===0?C.red:C.border}`}}>
                <div style={{width:22,height:22,borderRadius:"50%",background:i===0?C.red:C.border,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:900,fontSize:11,color:i===0?C.silver:C.muted,flexShrink:0,marginRight:2}}>{i+1}</div>
              <AvatarCircle name={s.name} photo={avatarMap[s.name]||null} size={34}/>
                <div style={{flex:1}}>
                  <div style={{fontWeight:800,fontSize:15}}>{s.name}</div>
                  <div style={{fontSize:11,color:C.muted}}>{Object.entries(s.weeks||{}).map(([wk,pts])=>`Wk${wk}: ${pts}`).join(" · ")}</div>
                </div>
                <div style={{textAlign:"right"}}>
                  <div style={{fontSize:22,fontWeight:900,color:i===0?C.red:C.silver}}>{s.total}</div>
                  <div style={{fontSize:10,color:C.muted}}>TOTAL</div>
                </div>
                {wkPts!=null&&<div style={{textAlign:"right",minWidth:32}}>
                  <div style={{fontSize:16,fontWeight:800,color:C.textDim}}>{wkPts}</div>
                  <div style={{fontSize:10,color:C.muted}}>WK{viewWeek}</div>
                </div>}
              </div>
            );
          })
        }
      </div>
      {isWeekScored(viewWeek)&&pastWeekData&&(
        <div>
          <div style={{...S.card,background:C.bg,border:`1px solid ${C.green}`}}>
            <div style={{fontWeight:800,color:C.green,marginBottom:4}}>Week {viewWeek} — Everyone's Picks</div>
          </div>
          {Object.entries(pastWeekData.picks).map(([name,userPicks])=>{
            const mortal=pastWeekData.mortals[name];
            const{total,breakdown}=scoreUser(userPicks,mortal,pastWeekData.results);
            return(
              <div key={name} style={S.card}>
                <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}>
                  <span style={{fontWeight:800,color:C.red}}>{name}</span>
                  <span style={{fontWeight:900}}>{total} pts</span>
                </div>
                {flatPicks(userPicks).map(({gameId,slot,value})=>{
                  const game=pastWeekData.games.find(g=>g.id===gameId);
                  if(!game) return null;
                  const key=`${gameId}:${slot}`;
                  const pts=breakdown[key];
                  const res=pastWeekData.results[gameId];
                  const isMortal=mortal?.gameId===gameId&&mortal?.slot===slot;
                  const isPush=res==="push_spread"||res==="push_total";
                  const isWin=res!=null&&!isPush&&pts>0;
                  const color=res==null?C.muted:isPush?C.gold:isWin?C.green:C.red;
                  return(
                    <div key={key} style={{fontSize:13,padding:"3px 0",color,display:"flex",justifyContent:"space-between"}}>
                      <span>{res==null?"·":isPush?"½":isWin?"✓":"✗"} {game.away} @ {game.home} — {slotLabel(game,slot,value)}{isMortal?" 🔒":""}</span>
                      {res!=null&&<span style={{fontWeight:700}}>+{pts}</span>}
                    </div>
                  );
                })}
              </div>
            );
          })}
        </div>
      )}
      <div style={{textAlign:"center",padding:"16px 0 4px",fontSize:11,color:C.muted,letterSpacing:1}}>v{VERSION}</div>
        <PickProgressStrip/>
      <BottomNav active="standings"/>
      {toast&&<div style={S.toast}>{toast}</div>}
    </div>
  );

  // ── ADMIN ────────────────────────────────────────────────────────────────
  if(screen==="admin"){
    return(
      <div style={S.app}>
        {/* Header */}
        <div style={S.header}>
          <span style={{...S.logo,color:"#ffffff"}}>⚙ ADMIN</span>
          <div style={{display:"flex",alignItems:"center",gap:6}}><ThemeToggle/><LogoutBtn/></div>
        </div>

        {/* Sticky week selector + tab bar */}
        <div style={{
          position:"sticky",top:56,zIndex:9,
          background:C.surface,
          borderBottom:`1px solid ${C.border}`,
          padding:"10px 14px 0",
        }}>
          {/* Week stepper */}
          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}>
            <button onClick={()=>setViewWeek(w=>Math.max(1,w-1))}
              style={{background:C.bg,border:`1px solid ${C.border}`,color:C.text,borderRadius:8,width:36,height:36,cursor:"pointer",fontSize:18,fontWeight:900,display:"flex",alignItems:"center",justifyContent:"center"}}>‹</button>
            <div style={{flex:1,textAlign:"center",fontWeight:900,fontSize:16,color:C.silver}}>
              Week {viewWeek}
              {viewWeek===currentWeek&&<span style={{fontSize:11,color:C.red,marginLeft:8,fontWeight:700}}>CURRENT</span>}
            </div>
            <button onClick={()=>setViewWeek(w=>Math.min(18,w+1))}
              style={{background:C.bg,border:`1px solid ${C.border}`,color:C.text,borderRadius:8,width:36,height:36,cursor:"pointer",fontSize:18,fontWeight:900,display:"flex",alignItems:"center",justifyContent:"center"}}>›</button>
          </div>

          {/* Tabs */}
          <div style={{display:"flex",gap:6,paddingBottom:0}}>
            {[["results","Results"],["picks","All Picks"],["manage","Manage"]].map(([id,label])=>(
              <button key={id} style={{
                flex:1,padding:"8px 4px",
                background:adminTab===id?C.red:C.bg,
                color:adminTab===id?"#ffffff":C.muted,
                border:`1px solid ${adminTab===id?C.red:C.border}`,
                borderRadius:"8px 8px 0 0",fontWeight:700,fontSize:13,cursor:"pointer",
                borderBottom:adminTab===id?`2px solid ${C.red}`:`1px solid ${C.border}`,
              }} onClick={()=>{
                setAdminTab(id);
                if(id==="results"||id==="picks") loadAdminWeek(viewWeek);
                if(id==="results") {
                  setFetchingScores(true);
                  fetchESPNScores(viewWeek, viewGames).then(scores=>{
                    setFetchingScores(false);
                    if(!scores||scores.length===0) return;
                    const auto={...pendingResults};
                    scores.forEach(sc=>{
                      if(sc.status!=="final") return;
                      const game=viewGames.find(g=>g.id===sc.id);
                      if(!game) return;
                      const r=calcResult(game,sc.homeScore,sc.awayScore);
                      if(!auto[game.id]) auto[game.id]={};
                      if(r.spread) auto[game.id].spread=r.spread;
                      if(r.total) auto[game.id].total=r.total;
                    });
                    setPendingResults(auto);
                  });
                }
              }}>{label}</button>
            ))}
          </div>
        </div>

        {/* ── RESULTS TAB ── */}
        {adminTab==="results"&&(
          <div style={{paddingBottom:20}}>
            {/* Status bar */}
            <div style={{...S.card,padding:"10px 16px",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
              <span style={{fontSize:12,color:fetchingScores?C.gold:C.muted}}>
                {fetchingScores?"Pulling scores from ESPN…":"Save each game as it finishes — no need to wait for the full week."}
              </span>
              <button onClick={()=>{
                setFetchingScores(true);
                fetchESPNScores(viewWeek, viewGames).then(scores=>{
                  setFetchingScores(false);
                  if(!scores||scores.length===0){showToast("No final scores yet.");return;}
                  const auto={...pendingResults};
                  scores.forEach(sc=>{
                    if(sc.status!=="final") return;
                    const game=viewGames.find(g=>g.id===sc.id);
                    if(!game) return;
                    const r=calcResult(game,sc.homeScore,sc.awayScore);
                    if(!auto[game.id]) auto[game.id]={};
                    if(r.spread) auto[game.id].spread=r.spread;
                    if(r.total) auto[game.id].total=r.total;
                  });
                  setPendingResults(auto);
                  showToast("Scores pulled ✅");
                });
              }} style={{
                background:fetchingScores?C.border:C.blue,color:"#fff",
                border:"none",borderRadius:7,padding:"6px 12px",
                fontSize:11,fontWeight:700,cursor:fetchingScores?"not-allowed":"pointer",
                opacity:fetchingScores?0.6:1,flexShrink:0,
              }} disabled={fetchingScores}>
                {fetchingScores?"Loading…":"Pull Scores"}
              </button>
            </div>

            {/* Game result cards */}
            {loadingGames
              ?<div style={{textAlign:"center",padding:40,color:C.muted}}>Loading games…</div>
              :viewGames.map(game=>{
                const pr = pendingResults[game.id]||{};
                const sp = parseSpread(game);
                const hasSpread = !!game.spread;
                const hasTotal = !!game.total;
                return(
                  <div key={game.id} style={{...S.card,marginBottom:8}}>
                    {/* Game header */}
                    <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
                      <TeamLogo abbr={game.awayAbbr||TEAM_ABBR[game.away]} size={22}/>
                      <span style={{fontWeight:700,fontSize:14,flex:1}}>{game.away} @ {game.home}</span>
                      <TeamLogo abbr={game.homeAbbr||TEAM_ABBR[game.home]} size={22}/>
                    </div>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
                      <span style={{fontSize:11,color:C.muted}}>{game.dateLabel}</span>
                      {results[game.id]&&(results[game.id].spread||results[game.id].total)&&(
                        <span style={{fontSize:10,fontWeight:800,color:C.green,letterSpacing:0.5}}>✓ SAVED</span>
                      )}
                    </div>

                    {/* Spread result */}
                    {hasSpread&&(
                      <div style={{marginBottom:8}}>
                        <div style={{fontSize:10,color:C.muted,letterSpacing:1,marginBottom:5,fontWeight:600}}>
                          SPREAD · {game.spread}
                        </div>
                        <div style={{display:"flex",gap:6}}>
                          {[
                            {k:"spread_away",l:`${game.away} ${sp?sp.awayLine:"covers"}`},
                            {k:"spread_home",l:`${game.home} ${sp?sp.homeLine:"covers"}`},
                            {k:"push_spread",l:"Push"},
                          ].map(opt=>(
                            <button key={opt.k}
                              style={{
                                flex:1,padding:"8px 4px",borderRadius:8,
                                fontSize:11,fontWeight:700,cursor:"pointer",
                                background:pr.spread===opt.k?C.red:"#1e2d48",
                                color:pr.spread===opt.k?"#fff":"#d0ddf0",
                                border:`1.5px solid ${pr.spread===opt.k?C.red:"#3a4f72"}`,
                              }}
                              onClick={()=>setPendingResults(r=>({
                                ...r,[game.id]:{...(r[game.id]||{}),
                                  spread:r[game.id]?.spread===opt.k?null:opt.k}
                              }))}>
                              {opt.l}
                            </button>
                          ))}
                        </div>
                      </div>
                    )}

                    {/* Total result */}
                    {hasTotal&&(
                      <div>
                        <div style={{fontSize:10,color:C.muted,letterSpacing:1,marginBottom:5,fontWeight:600}}>
                          TOTAL · {game.total}
                        </div>
                        <div style={{display:"flex",gap:6}}>
                          {[
                            {k:"over",  l:`Over ${game.total?.replace("O/U ","")||""}`},
                            {k:"under", l:`Under ${game.total?.replace("O/U ","")||""}`},
                            {k:"push_total",l:"Push"},
                          ].map(opt=>(
                            <button key={opt.k}
                              style={{
                                flex:1,padding:"8px 4px",borderRadius:8,
                                fontSize:11,fontWeight:700,cursor:"pointer",
                                background:pr.total===opt.k?C.blueBright:"#1e2d48",
                                color:pr.total===opt.k?"#fff":"#d0ddf0",
                                border:`1.5px solid ${pr.total===opt.k?C.blueBright:"#3a4f72"}`,
                              }}
                              onClick={()=>setPendingResults(r=>({
                                ...r,[game.id]:{...(r[game.id]||{}),
                                  total:r[game.id]?.total===opt.k?null:opt.k}
                              }))}>
                              {opt.l}
                            </button>
                          ))}
                        </div>
                      </div>
                    )}
                    <button onClick={()=>saveGameResult(game.id)} style={{
                      width:"100%",marginTop:10,padding:"9px",borderRadius:8,
                      background:"transparent",border:`1.5px solid ${C.green}`,color:C.green,
                      fontSize:12,fontWeight:700,cursor:"pointer",
                    }}>💾 Save This Game</button>
                  </div>
                );
              })
            }

            {/* Publish button */}
            <div style={{padding:"8px 14px 24px"}}>
              <button style={{...S.btn(C.green,"#fff"),fontSize:16,padding:16,borderRadius:12,
                boxShadow:`0 4px 16px ${C.green}44`}}
                onClick={async()=>{
                  await dbSetResults(viewWeek, pendingResults);
                  let newS=await dbGet("standings")||[];
                  // Score all players
                  const {picks:ap, mortals:am}=await dbGetAllPicks(viewWeek);
                  roster.forEach(p=>{
                    const userPicks=ap[p.name];
                    if(!userPicks){
                      let e=newS.find(s=>s.name===p.name);
                      if(e){if(!e.weeks[viewWeek]){const wks={...e.weeks,[viewWeek]:0};e.weeks=wks;}}
                      else newS.push({name:p.name,weeks:{[viewWeek]:0},total:0});
                      return;
                    }
                    const{total}=scoreUser(userPicks,am[p.name],pendingResults);
                    let e=newS.find(s=>s.name===p.name);
                    if(e){const wks={...e.weeks,[viewWeek]:total};e.weeks=wks;e.total=Object.values(wks).reduce((a,b)=>a+b,0);}
                    else newS.push({name:p.name,weeks:{[viewWeek]:total},total});
                  });
                  newS.sort((a,b)=>b.total-a.total||(b.pct||0)-(a.pct||0));
                  await dbSet("standings", newS);
                  setStandings(newS);
                  setResults(pendingResults);
                  await dbSet(`week_${viewWeek}_published`, true);
                  setResultsLocked(true);
                  showToast(`Week ${viewWeek} results published! ✅`);
                }}>
                Publish Week {viewWeek} Results
              </button>
            </div>
          </div>
        )}

        {/* ── ALL PICKS TAB ── */}
        {adminTab==="picks"&&(
          <div>
            {Object.keys(allPicks).length===0
              ?<div style={{textAlign:"center",padding:40,color:C.muted}}>
                  <div style={{fontSize:13}}>No picks submitted for Week {viewWeek} yet.</div>
                </div>
              :Object.entries(allPicks).map(([name,userPicks])=>{
                const mortal=allMortals[name];
                const{total,breakdown}=scoreUser(userPicks,mortal,results);
                return(
                  <div key={name} style={S.card}>
                    <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}>
                      <AvatarCircle name={name} photo={avatarMap[name]||null} size={36}/>
                      <div style={{flex:1,fontWeight:800,fontSize:15}}>{name}</div>
                      <span style={{fontWeight:900,fontSize:16,color:total>0?C.green:C.muted}}>{total>0?`${total} pts`:"—"}</span>
                    </div>
                    {flatPicks(userPicks).map(({gameId,slot,value})=>{
                      const game=viewGames.find(g=>g.id===gameId);
                      if(!game) return null;
                      const key=`${gameId}:${slot}`;
                      const pts=breakdown[key];
                      const res=results[gameId];
                      const isMortal=mortal?.gameId===gameId&&mortal?.slot===slot;
                      const isPush=res==="push_spread"||res==="push_total";
                      const isWin=res!=null&&!isPush&&pts>0;
                      const color=res==null?C.muted:isPush?C.gold:isWin?C.green:C.red;
                      return(
                        <div key={key} style={{fontSize:12,padding:"3px 0",color,display:"flex",justifyContent:"space-between",borderBottom:`1px solid ${C.border}`}}>
                          <span style={{padding:"4px 0"}}>
                            {res==null?"·":isPush?"½":isWin?"✓":"✗"}{" "}
                            {game.away} @ {game.home} — {slotLabel(game,slot,value)}{isMortal?" 🔒":""}
                          </span>
                          {res!=null&&<span style={{fontWeight:700,padding:"4px 0"}}>+{pts}</span>}
                        </div>
                      );
                    })}
                  </div>
                );
              })
            }
          </div>
        )}

        {/* ── MANAGE TAB ── */}
        {adminTab==="manage"&&(
          <div>
            {/* Commissioner note */}
            <div style={S.card}>
              <div style={{fontWeight:800,fontSize:14,marginBottom:12,color:C.silver}}>COMMISSIONER NOTE — WEEK {viewWeek}</div>
              <div style={{fontSize:11,color:C.muted,marginBottom:10}}>Shown to players at the top of their Picks screen for this week. Leave blank to hide.</div>
              {editingNote?(
                <>
                  <textarea
                    value={noteInput}
                    onChange={e=>setNoteInput(e.target.value)}
                    placeholder="e.g. Injury news, bye week reminders, league rule updates..."
                    style={{...S.input,minHeight:80,resize:"vertical",fontFamily:"inherit"}}
                  />
                  <div style={{display:"flex",gap:8,marginTop:8}}>
                    <button style={{...S.btn(C.green,"#fff"),flex:1}} onClick={async()=>{
                      await dbSet(`commissioner_note_week_${viewWeek}`, noteInput.trim());
                      setCommissionerNote(noteInput.trim());
                      setEditingNote(false);
                      showToast("Note saved ✅");
                    }}>Save Note</button>
                    <button style={{...S.btn(C.surface,C.muted),border:`1px solid ${C.border}`,flex:1}} onClick={()=>{setNoteInput(commissionerNote);setEditingNote(false);}}>Cancel</button>
                  </div>
                </>
              ):(
                <>
                  {commissionerNote?(
                    <div style={{background:C.bg,border:`1px solid ${C.border}`,borderRadius:8,padding:"10px 12px",fontSize:13,color:C.text,marginBottom:10,whiteSpace:"pre-wrap"}}>{commissionerNote}</div>
                  ):(
                    <div style={{fontSize:12,color:C.muted,fontStyle:"italic",marginBottom:10}}>No note set for this week.</div>
                  )}
                  <button style={{...S.btn(C.blue,"#fff")}} onClick={()=>setEditingNote(true)}>
                    {commissionerNote?"Edit Note":"+ Add Note"}
                  </button>
                </>
              )}
            </div>

            {/* Admin PIN reset */}
            <div style={S.card}>
              <div style={{fontWeight:800,fontSize:14,marginBottom:12,color:C.silver}}>ADMIN PIN</div>
              {editingAdminPin?(
                <>
                  <label style={{fontSize:11,color:C.muted,display:"block",marginBottom:6}}>NEW 6-DIGIT PIN</label>
                  <input
                    type="tel" inputMode="numeric" maxLength={6}
                    value={newAdminPin1}
                    onChange={e=>{setNewAdminPin1(e.target.value.replace(/\D/g,"").slice(0,6));setAdminPinErr("");}}
                    style={S.input}
                    placeholder="6 digits"
                  />
                  <label style={{fontSize:11,color:C.muted,display:"block",margin:"10px 0 6px"}}>CONFIRM NEW PIN</label>
                  <input
                    type="tel" inputMode="numeric" maxLength={6}
                    value={newAdminPin2}
                    onChange={e=>{setNewAdminPin2(e.target.value.replace(/\D/g,"").slice(0,6));setAdminPinErr("");}}
                    style={S.input}
                    placeholder="Re-enter 6 digits"
                  />
                  {adminPinErr&&<div style={S.error}>{adminPinErr}</div>}
                  <div style={{display:"flex",gap:8,marginTop:10}}>
                    <button style={{...S.btn(C.green,"#fff"),flex:1}} onClick={async()=>{
                      if(newAdminPin1.length!==6){setAdminPinErr("Must be 6 digits.");return;}
                      if(newAdminPin1!==newAdminPin2){setAdminPinErr("PINs don't match.");return;}
                      await dbSet("admin_pin", newAdminPin1);
                      setAdminPinLive(newAdminPin1);
                      setEditingAdminPin(false);
                      setNewAdminPin1("");setNewAdminPin2("");setAdminPinErr("");
                      showToast("Admin PIN updated ✅");
                    }}>Save New PIN</button>
                    <button style={{...S.btn(C.surface,C.muted),border:`1px solid ${C.border}`,flex:1}} onClick={()=>{
                      setEditingAdminPin(false);setNewAdminPin1("");setNewAdminPin2("");setAdminPinErr("");
                    }}>Cancel</button>
                  </div>
                </>
              ):(
                <>
                  <div style={{fontSize:12,color:C.muted,marginBottom:10}}>Current PIN is 6 digits. Change it any time — takes effect immediately.</div>
                  <button style={{...S.btn(C.blue,"#fff")}} onClick={()=>setEditingAdminPin(true)}>Reset Admin PIN</button>
                </>
              )}
            </div>

            {/* Season controls */}
            <div style={S.card}>
              <div style={{fontWeight:800,fontSize:14,marginBottom:12,color:C.silver}}>SEASON CONTROLS</div>
              <div style={{display:"flex",gap:8,marginBottom:8}}>
                <button style={{...S.btn(C.red),flex:1,padding:11,fontSize:13}} onClick={advanceWeek}>
                  Advance to Week {currentWeek+1}
                </button>
              </div>
              <button style={{...S.btn("#1e2d48","#d0ddf0"),border:`1px solid ${C.border}`,fontSize:13}} onClick={async()=>{
                setFetchingScores(true);
                const g=await fetchNFLGames(viewWeek)||placeholderGames(viewWeek);
                await storageSet(`games_week_${viewWeek}`,g);
                if(viewWeek===currentWeek) setGames(g);
                setViewGames(g); setFetchingScores(false);
                showToast("Games refreshed!");
              }}>
                {fetchingScores?"Refreshing…":"🔄 Force Refresh Week "+viewWeek+" Games"}
              </button>
            </div>

            {/* ESPN Test */}
            <div style={S.card}>
              <div style={{fontWeight:800,fontSize:14,marginBottom:4,color:C.silver}}>ESPN SCORE TEST</div>
              <div style={{fontSize:12,color:C.muted,marginBottom:10}}>Test auto-score pull for any week.</div>
              <button style={{...S.btn(C.blue),fontSize:13}} onClick={async()=>{
                setEspnTestLog(["Fetching Week "+viewWeek+" scores…"]);
                setEspnTesting(true);
                const scores=await fetchESPNScores(viewWeek, viewGames);
                setEspnTesting(false);
                if(!scores||scores.length===0){setEspnTestLog(l=>[...l,"❌ No scores returned."]);return;}
                setEspnTestLog(l=>[...l,"✅ "+scores.length+" games:"]);
                scores.forEach(s=>{
                  const g=viewGames.find(x=>x.id===s.id);
                  const name=g?`${g.away} @ ${g.home}`:`Game ${s.id}`;
                  const r=g?calcResult(g,s.homeScore,s.awayScore):{};
                  setEspnTestLog(l=>[...l,`${s.status==="final"?"✓":"·"} ${name}: ${s.awayScore!=null?s.awayScore+"-"+s.homeScore:"no score"} → spread:${r.spread||"—"} total:${r.total||"—"}`]);
                });
              }} disabled={espnTesting}>
                {espnTesting?"Testing…":"Run ESPN Test (Week "+viewWeek+")"}
              </button>
              {espnTestLog.length>0&&(
                <div style={{background:C.bg,borderRadius:8,padding:12,fontFamily:"monospace",fontSize:11,lineHeight:1.8,marginTop:10}}>
                  {espnTestLog.map((line,i)=>(
                    <div key={i} style={{color:line.startsWith("✅")||line.startsWith("  ✓")?C.green:line.startsWith("❌")?C.red:C.muted}}>{line||" "}</div>
                  ))}
                </div>
              )}
            </div>

            {/* Roster */}
            <div style={S.card}>
              <div style={{fontWeight:800,fontSize:14,marginBottom:12,color:C.silver}}>PLAYER ROSTER</div>
              <div style={{marginBottom:14}}>
                <label style={{fontSize:11,color:C.muted,display:"block",marginBottom:6,letterSpacing:1}}>ADD PLAYER</label>
                <div style={{display:"flex",gap:8,marginBottom:8}}>
                  <input style={{...S.input,flex:2}} placeholder="Name" value={newPlayerName} onChange={e=>setNewPlayerName(e.target.value)}/>
                  <input style={{...S.input,flex:1}} placeholder="PIN" type="password" maxLength={4} value={newPlayerPin} onChange={e=>setNewPlayerPin(e.target.value.replace(/\D/g,"").slice(0,4))}/>
                </div>
                <button style={S.btn(C.green,"#fff")} onClick={async()=>{
                  const name=newPlayerName.trim();
                  if(!name||newPlayerPin.length!==4){showToast("Enter name and 4-digit PIN.");return;}
                  const existing=await dbGetRoster();
                  if(existing.find(p=>p.name.toLowerCase()===name.toLowerCase())){showToast(`${name} already exists.`);return;}
                  const updated=[...existing,{name,pin:newPlayerPin}];
                  await dbAddPlayer(name, newPlayerPin);
                  setRoster(updated);
                  setNewPlayerName("");setNewPlayerPin("");
                  showToast(`${name} added ✅`);
                }}>+ Add Player</button>
              </div>
              <div style={{fontSize:11,color:C.muted,marginBottom:8,letterSpacing:1}}>ROSTER ({roster.length})</div>
              {roster.map((p,i)=>(
                <div key={p.name} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 12px",background:C.bg,borderRadius:8,marginBottom:6,border:`1px solid ${C.border}`}}>
                  <AvatarCircle name={p.name} photo={avatarMap[p.name]||null} size={34}/>
                  <div style={{flex:1}}>
                    <div style={{fontWeight:700,fontSize:14}}>{p.name}</div>
                    <div style={{fontSize:11,color:C.muted}}>PIN: <span style={{fontWeight:700,letterSpacing:2,color:C.silver}}>{p.pin}</span></div>
                  </div>
                  <div style={{display:"flex",gap:6}}>
                    <InlineReset name={p.name} roster={roster} setRoster={setRoster} showToast={showToast} C={C} storageSet={storageSet} storageSaveNow={storageSaveNow}/>
                    <button onClick={async()=>{
                      const updated=roster.filter((_,idx)=>idx!==i);
                      await dbRemovePlayer(p.name);
                      setRoster(updated);
                      showToast(`${p.name} removed.`);
                    }} style={{background:"#2a0a0a",border:`1px solid ${C.red}`,color:C.red,borderRadius:6,padding:"5px 10px",fontSize:12,cursor:"pointer",fontWeight:700}}>
                      Remove
                    </button>
                  </div>
                </div>
              ))}
            </div>

            {/* Scoring rules */}
            <div style={S.card}>
              <div style={{fontWeight:800,fontSize:14,marginBottom:10,color:C.silver}}>SCORING RULES</div>
              {[["Regular pick correct","1 pt"],["Mortal Lock correct","2 pts"],["Regular push","0.5 pts"],["Mortal Lock push","1 pt"],["Wrong","0 pts"]].map(([r,p])=>(
                <div key={r} style={{display:"flex",justifyContent:"space-between",padding:"6px 0",borderBottom:`1px solid ${C.border}`,fontSize:13}}>
                  <span style={{color:C.muted}}>{r}</span>
                  <span style={{color:C.gold,fontWeight:700}}>{p}</span>
                </div>
              ))}
            </div>

            <div style={{textAlign:"center",padding:"16px 0 4px",fontSize:11,color:C.muted}}>v{VERSION}</div>
          </div>
        )}

        {toast&&<div style={S.toast}>{toast}</div>}
      </div>
    );
  }

  return null;
}


    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App/>);
  </script>
</body>
</html>
