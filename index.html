            <div key={p.name} style={S.card}>
              <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14}}>
                <AvatarCircle name={p.name} photo={avatarMap[p.name]||null} size={40}/>
                <div style={{flex:1}}>
                  <div style={{fontWeight:900,fontSize:16}}>{p.name}</div>
                  <div style={{fontSize:12,color:C.muted}}>{p.totalPicks} picks · {p.total} pts</div>
                </div>
                <div style={{textAlign:"right"}}>
                  <div style={{fontSize:24,fontWeight:900,color:C.accent}}>{p.pct}%</div>
                  <div style={{fontSize:10,color:C.muted}}>OVERALL</div>
                </div>
              </div>
              <StatBar label="Spread" correct={p.spreadCorrect} total={p.spreadPicks} push={p.spreadPush} color={C.accent}/>
              <StatBar label="Over/Under" correct={p.ouCorrect} total={p.ouPicks} push={p.ouPush} color={C.blueBright}/>
              <StatBar label="Mortal Lock" correct={p.mlCorrect} total={p.mlPicks} push={p.mlPush} color={C.gold}/>

            </div>
          ))
        )}
        <PickProgressStrip/>
        <BottomNav active="stats"/>
        <div style={{textAlign:"center",padding:"16px 0 4px",fontSize:11,color:C.muted}}>v{VERSION}</div>
        {toast&&<div style={S.toast}>{toast}</div>}
      </div>
    );
  }

  // ── STANDINGS ────────────────────────────────────────────────────────────
  if(screen==="standings") return(
    <div style={S.app}>
      <div style={S.header}><span style={S.logo}><img src={THEMES[seasonTheme]&&THEMES[seasonTheme].mini?THEMES[seasonTheme].mini:LOGO_DATA_URL} alt="NFL Pick'em" style={{height:THEMES[seasonTheme]?32:28,width:"auto",objectFit:"contain",borderRadius:THEMES[seasonTheme]?5:0,filter:C.isLight?"none":"brightness(1.1)"}}/>{THEMES[seasonTheme]&&<span style={{display:"flex",alignItems:"center",gap:6,marginLeft:6}}><span style={{fontSize:22,lineHeight:1}}>{THEMES[seasonTheme].emoji}</span><span style={{display:"flex",flexDirection:"column",fontSize:10,fontWeight:900,letterSpacing:1.2,lineHeight:1.15,color:"#ffffff",textTransform:"uppercase",textAlign:"left"}}><span>{THEMES[seasonTheme].greet[0]}</span><span>{THEMES[seasonTheme].greet[1]}</span></span></span>}</span><div style={{display:'flex',alignItems:'center',gap:6}}>
          <button onClick={()=>loadStandings()} style={{background:"transparent",border:`1px solid ${C.border}`,color:C.muted,borderRadius:6,padding:"4px 8px",fontSize:11,cursor:"pointer",fontWeight:700,letterSpacing:0.5}}>↻</button>
          <ProfileBtn/><LogoutBtn/></div></div>
      <div style={{padding:"10px 0"}}>
        {standings.length===0
          ?<div style={{textAlign:"center",padding:40,color:C.muted}}>No results yet.</div>
          :standings.map((s,i)=>{
            const wkPts=s.weeks?.[viewWeek]??null;
            return(
              <div key={s.name} style={{display:"flex",alignItems:"center",gap:12,padding:"12px 16px",background:i===0?C.isLight?`${C.accent}18`:C.surface:C.surface,borderRadius:10,margin:"6px 14px",border:`1px solid ${i===0?C.accent:C.border}`}}>
                <div style={{width:22,height:22,borderRadius:"50%",background:i===0?C.accent:C.border,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:900,fontSize:11,color:i===0?C.silver:C.muted,flexShrink:0,marginRight:2}}>{i+1}</div>
              <AvatarCircle name={s.name} photo={avatarMap[s.name]||null} size={34}/>
                <div style={{flex:1}}>
                  <div style={{fontWeight:800,fontSize:15}}>{s.name}</div>
                  <div style={{fontSize:11,color:C.muted}}>{Object.entries(s.weeks||{}).map(([wk,pts])=>`Wk${wk}: ${pts}`).join(" · ")}</div>
                </div>
                <div style={{textAlign:"right"}}>
                  <div style={{fontSize:22,fontWeight:900,color:i===0?C.accent:C.silver}}>{s.total}</div>
                  <div style={{fontSize:10,color:C.muted}}>TOTAL</div>
                </div>
                {wkPts!=null&&<div style={{textAlign:"right",minWidth:32}}>
                  <div style={{fontSize:16,fontWeight:800,color:C.textDim}}>{wkPts}</div>
                  <div style={{fontSize:10,color:C.muted}}>WK{viewWeek}</div>
                </div>}
              </div>
            );
          })
        }
      </div>
      {isWeekScored(viewWeek)&&pastWeekData&&(
        <div>
          <div style={{...S.card,background:C.bg,border:`1px solid ${C.green}`}}>
            <div style={{fontWeight:800,color:C.green,marginBottom:4}}>Week {viewWeek} — Everyone's Picks</div>
          </div>
          {Object.entries(pastWeekData.picks).map(([name,userPicks])=>{
            const mortal=pastWeekData.mortals[name];
            const{total,breakdown}=scoreUser(userPicks,mortal,pastWeekData.results);
            return(
              <div key={name} style={S.card}>
                <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}>
                  <span style={{fontWeight:800,color:C.accent}}>{name}</span>
                  <span style={{fontWeight:900}}>{total} pts</span>
                </div>
                {flatPicks(userPicks).map(({gameId,slot,value})=>{
                  const game=pastWeekData.games.find(g=>g.id===gameId);
                  if(!game) return null;
                  const key=`${gameId}:${slot}`;
                  const pts=breakdown[key];
                  const res=pastWeekData.results[gameId];
                  const isMortal=mortal?.gameId===gameId&&mortal?.slot===slot;
                  const isPush=res==="push_spread"||res==="push_total";
                  const isWin=res!=null&&!isPush&&pts>0;
                  const color=res==null?C.muted:isPush?C.gold:isWin?C.green:C.accent;
                  return(
                    <div key={key} style={{fontSize:13,padding:"3px 0",color,display:"flex",justifyContent:"space-between"}}>
                      <span>{res==null?"·":isPush?"½":isWin?"✓":"✗"} {game.away} @ {game.home} — {slotLabel(game,slot,value)}{isMortal?" 🔒":""}</span>
                      {res!=null&&<span style={{fontWeight:700}}>+{pts}</span>}
                    </div>
                  );
                })}
              </div>
            );
          })}
        </div>
      )}
      <div style={{textAlign:"center",padding:"16px 0 4px",fontSize:11,color:C.muted,letterSpacing:1}}>v{VERSION}</div>
        <PickProgressStrip/>
      <BottomNav active="standings"/>
      {toast&&<div style={S.toast}>{toast}</div>}
    </div>
  );

  // ── ADMIN ────────────────────────────────────────────────────────────────
  if(screen==="admin"){
    return(
      <div style={S.app}>
        {/* Header */}
        <div style={S.header}>
          <span style={{...S.logo,color:"#ffffff"}}>⚙ ADMIN</span>
          <div style={{display:"flex",alignItems:"center",gap:6}}><ThemeToggle/><LogoutBtn/></div>
        </div>

        {/* Sticky week selector + tab bar */}
        <div style={{
          position:"sticky",top:"calc(56px + env(safe-area-inset-top, 0px))",zIndex:9,
          background:C.surface,
          borderBottom:`1px solid ${C.border}`,
          padding:"10px 14px 0",
        }}>
          {/* Week stepper */}
          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}>
            <button onClick={()=>setViewWeek(w=>Math.max(1,w-1))}
              style={{background:C.bg,border:`1px solid ${C.border}`,color:C.text,borderRadius:8,width:36,height:36,cursor:"pointer",fontSize:18,fontWeight:900,display:"flex",alignItems:"center",justifyContent:"center"}}>‹</button>
            <div style={{flex:1,textAlign:"center",fontWeight:900,fontSize:16,color:C.silver}}>
              Week {viewWeek}
              {viewWeek===currentWeek&&<span style={{fontSize:11,color:C.accent,marginLeft:8,fontWeight:700}}>CURRENT</span>}
            </div>
            <button onClick={()=>setViewWeek(w=>Math.min(18,w+1))}
              style={{background:C.bg,border:`1px solid ${C.border}`,color:C.text,borderRadius:8,width:36,height:36,cursor:"pointer",fontSize:18,fontWeight:900,display:"flex",alignItems:"center",justifyContent:"center"}}>›</button>
          </div>

          {/* Tabs */}
          <div style={{display:"flex",gap:6,paddingBottom:0}}>
            {[["results","Results"],["picks","All Picks"],["manage","Manage"]].map(([id,label])=>(
              <button key={id} style={{
                flex:1,padding:"8px 4px",
                background:adminTab===id?C.accent:C.bg,
                color:adminTab===id?"#ffffff":C.muted,
                border:`1px solid ${adminTab===id?C.accent:C.border}`,
                borderRadius:"8px 8px 0 0",fontWeight:700,fontSize:13,cursor:"pointer",
                borderBottom:adminTab===id?`2px solid ${C.accent}`:`1px solid ${C.border}`,
              }} onClick={()=>{
                setAdminTab(id);
                if(id==="results"||id==="picks") loadAdminWeek(viewWeek);
                if(id==="results") {
                  setFetchingScores(true);
                  fetchESPNScores(viewWeek, viewGames).then(scores=>{
                    setFetchingScores(false);
                    if(!scores||scores.length===0) return;
                    const auto={...pendingResults};
                    scores.forEach(sc=>{
                      if(sc.status!=="final") return;
                      const game=viewGames.find(g=>g.id===sc.id);
                      if(!game) return;
                      const r=calcResult(game,sc.homeScore,sc.awayScore);
                      if(!auto[game.id]) auto[game.id]={};
                      if(r.spread) auto[game.id].spread=r.spread;
                      if(r.total) auto[game.id].total=r.total;
                    });
                    setPendingResults(auto);
                  });
                }
              }}>{label}</button>
            ))}
          </div>
        </div>

        {/* ── RESULTS TAB ── */}
        {adminTab==="results"&&(
          <div style={{paddingBottom:20}}>
            {/* Status bar */}
            <div style={{...S.card,padding:"10px 16px",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
              <span style={{fontSize:12,color:fetchingScores?C.gold:C.muted}}>
                {fetchingScores?"Pulling scores from ESPN…":"Save each game as it finishes — no need to wait for the full week."}
              </span>
              <button onClick={()=>{
                setFetchingScores(true);
                fetchESPNScores(viewWeek, viewGames).then(scores=>{
                  setFetchingScores(false);
                  if(!scores||scores.length===0){showToast("No final scores yet.");return;}
                  const auto={...pendingResults};
                  scores.forEach(sc=>{
                    if(sc.status!=="final") return;
                    const game=viewGames.find(g=>g.id===sc.id);
                    if(!game) return;
                    const r=calcResult(game,sc.homeScore,sc.awayScore);
                    if(!auto[game.id]) auto[game.id]={};
                    if(r.spread) auto[game.id].spread=r.spread;
                    if(r.total) auto[game.id].total=r.total;
                  });
                  setPendingResults(auto);
                  showToast("Scores pulled ✅");
                });
              }} style={{
                background:fetchingScores?C.border:C.blue,color:"#fff",
                border:"none",borderRadius:7,padding:"6px 12px",
                fontSize:11,fontWeight:700,cursor:fetchingScores?"not-allowed":"pointer",
                opacity:fetchingScores?0.6:1,flexShrink:0,
              }} disabled={fetchingScores}>
                {fetchingScores?"Loading…":"Pull Scores"}
              </button>
            </div>

            {/* Game result cards */}
            {loadingGames
              ?<div style={{textAlign:"center",padding:40,color:C.muted}}>Loading games…</div>
              :viewGames.map(game=>{
                const pr = pendingResults[game.id]||{};
                const sp = parseSpread(game);
                const hasSpread = !!game.spread;
                const hasTotal = !!game.total;
                return(
                  <div key={game.id} style={{...S.card,marginBottom:8}}>
                    {/* Game header */}
                    <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
                      <TeamLogo abbr={game.awayAbbr||TEAM_ABBR[game.away]} size={22}/>
                      <span style={{fontWeight:700,fontSize:14,flex:1}}>{game.away} @ {game.home}</span>
                      <TeamLogo abbr={game.homeAbbr||TEAM_ABBR[game.home]} size={22}/>
                    </div>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
                      <span style={{fontSize:11,color:C.muted}}>{game.dateLabel}</span>
                      {results[game.id]&&(results[game.id].spread||results[game.id].total)&&(
                        <span style={{fontSize:10,fontWeight:800,color:C.green,letterSpacing:0.5}}>✓ SAVED</span>
                      )}
                    </div>

                    {/* Spread result */}
                    {hasSpread&&(
                      <div style={{marginBottom:8}}>
                        <div style={{fontSize:10,color:C.muted,letterSpacing:1,marginBottom:5,fontWeight:600}}>
                          SPREAD · {game.spread}
                        </div>
                        <div style={{display:"flex",gap:6}}>
                          {[
                            {k:"spread_away",l:`${game.away} ${sp?sp.awayLine:"covers"}`},
                            {k:"spread_home",l:`${game.home} ${sp?sp.homeLine:"covers"}`},
                            {k:"push_spread",l:"Push"},
                          ].map(opt=>(
                            <button key={opt.k}
                              style={{
                                flex:1,padding:"8px 4px",borderRadius:8,
                                fontSize:11,fontWeight:700,cursor:"pointer",
                                background:pr.spread===opt.k?C.accent:"#1e2d48",
                                color:pr.spread===opt.k?"#fff":"#d0ddf0",
                                border:`1.5px solid ${pr.spread===opt.k?C.accent:"#3a4f72"}`,
                              }}
                              onClick={()=>setPendingResults(r=>({
                                ...r,[game.id]:{...(r[game.id]||{}),
                                  spread:r[game.id]?.spread===opt.k?null:opt.k}
                              }))}>
                              {opt.l}
                            </button>
                          ))}
                        </div>
                      </div>
                    )}

                    {/* Total result */}
                    {hasTotal&&(
                      <div>
                        <div style={{fontSize:10,color:C.muted,letterSpacing:1,marginBottom:5,fontWeight:600}}>
                          TOTAL · {game.total}
                        </div>
                        <div style={{display:"flex",gap:6}}>
                          {[
                            {k:"over",  l:`Over ${game.total?.replace("O/U ","")||""}`},
                            {k:"under", l:`Under ${game.total?.replace("O/U ","")||""}`},
                            {k:"push_total",l:"Push"},
                          ].map(opt=>(
                            <button key={opt.k}
                              style={{
                                flex:1,padding:"8px 4px",borderRadius:8,
                                fontSize:11,fontWeight:700,cursor:"pointer",
                                background:pr.total===opt.k?C.blueBright:"#1e2d48",
                                color:pr.total===opt.k?"#fff":"#d0ddf0",
                                border:`1.5px solid ${pr.total===opt.k?C.blueBright:"#3a4f72"}`,
                              }}
                              onClick={()=>setPendingResults(r=>({
                                ...r,[game.id]:{...(r[game.id]||{}),
                                  total:r[game.id]?.total===opt.k?null:opt.k}
                              }))}>
                              {opt.l}
                            </button>
                          ))}
                        </div>
                      </div>
                    )}
                    <button onClick={()=>saveGameResult(game.id)} style={{
                      width:"100%",marginTop:10,padding:"9px",borderRadius:8,
                      background:"transparent",border:`1.5px solid ${C.green}`,color:C.green,
                      fontSize:12,fontWeight:700,cursor:"pointer",
                    }}>💾 Save This Game</button>
                  </div>
                );
              })
            }

            {/* Publish button */}
            <div style={{padding:"8px 14px 24px"}}>
              <button style={{...S.btn(C.green,"#fff"),fontSize:16,padding:16,borderRadius:12,
                boxShadow:`0 4px 16px ${C.green}44`}}
                onClick={async()=>{
                  await dbSetResults(viewWeek, pendingResults);
                  let newS=await dbGet("standings")||[];
                  // Score all players
                  const {picks:ap, mortals:am}=await dbGetAllPicks(viewWeek);
                  roster.forEach(p=>{
                    const userPicks=ap[p.name];
                    if(!userPicks){
                      let e=newS.find(s=>s.name===p.name);
                      if(e){if(!e.weeks[viewWeek]){const wks={...e.weeks,[viewWeek]:0};e.weeks=wks;}}
                      else newS.push({name:p.name,weeks:{[viewWeek]:0},total:0});
                      return;
                    }
                    const{total}=scoreUser(userPicks,am[p.name],pendingResults);
                    let e=newS.find(s=>s.name===p.name);
                    if(e){const wks={...e.weeks,[viewWeek]:total};e.weeks=wks;e.total=Object.values(wks).reduce((a,b)=>a+b,0);}
                    else newS.push({name:p.name,weeks:{[viewWeek]:total},total});
                  });
                  newS.sort((a,b)=>b.total-a.total||(b.pct||0)-(a.pct||0));
                  await dbSet("standings", newS);
                  setStandings(newS);
                  setResults(pendingResults);
                  // Publishing only saves + scores. It never freezes picks; advancing the week closes the old week.
                  await dbSet(`week_${viewWeek}_published`, false);
                  setResultsLocked(false);
                  showToast(`Week ${viewWeek} scores saved ✅ Picks stay open until you advance the week.`);
                }}>
                Save Week {viewWeek} Scores
              </button>
            </div>
          </div>
        )}

        {/* ── ALL PICKS TAB ── */}
        {adminTab==="picks"&&(
          <div>
            {Object.keys(allPicks).length===0
              ?<div style={{textAlign:"center",padding:40,color:C.muted}}>
                  <div style={{fontSize:13}}>No picks submitted for Week {viewWeek} yet.</div>
                </div>
              :Object.entries(allPicks).map(([name,userPicks])=>{
                const mortal=allMortals[name];
                const{total,breakdown}=scoreUser(userPicks,mortal,results);
                return(
                  <div key={name} style={S.card}>
                    <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}>
                      <AvatarCircle name={name} photo={avatarMap[name]||null} size={36}/>
                      <div style={{flex:1,fontWeight:800,fontSize:15}}>{name}</div>
                      <span style={{fontWeight:900,fontSize:16,color:total>0?C.green:C.muted}}>{total>0?`${total} pts`:"—"}</span>
                    </div>
                    {flatPicks(userPicks).map(({gameId,slot,value})=>{
                      const game=viewGames.find(g=>g.id===gameId);
                      if(!game) return null;
                      const key=`${gameId}:${slot}`;
                      const pts=breakdown[key];
                      const res=results[gameId];
                      const isMortal=mortal?.gameId===gameId&&mortal?.slot===slot;
                      const isPush=res==="push_spread"||res==="push_total";
                      const isWin=res!=null&&!isPush&&pts>0;
                      const color=res==null?C.muted:isPush?C.gold:isWin?C.green:C.accent;
                      return(
                        <div key={key} style={{fontSize:12,padding:"3px 0",color,display:"flex",justifyContent:"space-between",borderBottom:`1px solid ${C.border}`}}>
                          <span style={{padding:"4px 0"}}>
                            {res==null?"·":isPush?"½":isWin?"✓":"✗"}{" "}
                            {game.away} @ {game.home} — {slotLabel(game,slot,value)}{isMortal?" 🔒":""}
                          </span>
                          {res!=null&&<span style={{fontWeight:700,padding:"4px 0"}}>+{pts}</span>}
                        </div>
                      );
                    })}
                  </div>
                );
              })
            }
          </div>
        )}

        {/* ── MANAGE TAB ── */}
        {adminTab==="manage"&&(
          <div>
            {/* Season theme */}
            <div style={S.card}>
              <div style={{fontWeight:800,fontSize:14,marginBottom:12,color:C.silver}}>SEASON THEME</div>
              <div style={{fontSize:11,color:C.muted,marginBottom:10}}>Changes the look of the app for every player. Standard is the normal look. Win and loss colors never change. The login screen stays light.</div>
              <select
                value={seasonTheme}
                style={S.select}
                onChange={async(e)=>{
                  const v=e.target.value;
                  const ok=await dbSet("season_theme", v==="standard"?null:v);
                  if(ok){ setSeasonTheme(v); setToast(v==="standard"?"Standard theme on":`${THEMES[v].label} theme on`); setTimeout(()=>setToast(""),2500); }
                  else { setToast("Couldn't save theme. Run the season_theme SQL first."); setTimeout(()=>setToast(""),4000); }
                }}>
                <option value="standard">Standard</option>
                {Object.keys(THEMES).map(k=>(<option key={k} value={k}>{THEMES[k].emoji} {THEMES[k].label}</option>))}
              </select>
            </div>
            {/* Push nudge */}
            <div style={S.card}>
              <div style={{fontWeight:800,fontSize:14,marginBottom:12,color:C.silver}}>PICK REMINDER NUDGE</div>
              <div style={{fontSize:11,color:C.muted,marginBottom:10}}>Sends a push notification right now to every player who has reminders on and hasn't locked in picks for the current week.</div>
              <button style={S.btn(C.accent,"#ffffff")} onClick={async()=>{
                const r=await adminPushNudge();
                showToast(r&&r.ok?`Nudge queued for ${r.queued} player${r.queued===1?"":"s"}`:"Couldn't send the nudge. Run the push SQL first.");
              }}>🔔 NUDGE PLAYERS WHO HAVEN'T PICKED</button>
            </div>
            {/* Commissioner note */}
            <div style={S.card}>
              <div style={{fontWeight:800,fontSize:14,marginBottom:12,color:C.silver}}>COMMISSIONER NOTE — WEEK {viewWeek}</div>
              <div style={{fontSize:11,color:C.muted,marginBottom:10}}>Shown to players at the top of their Picks screen for this week. Leave blank to hide.</div>
              {editingNote?(
                <>
                  <textarea
                    value={noteInput}
                    onChange={e=>setNoteInput(e.target.value)}
                    placeholder="e.g. Injury news, bye week reminders, league rule updates..."
                    style={{...S.input,minHeight:80,resize:"vertical",fontFamily:"inherit"}}
                  />
                  <div style={{display:"flex",gap:8,marginTop:8}}>
                    <button style={{...S.btn(C.green,"#fff"),flex:1}} onClick={async()=>{
                      await dbSet(`commissioner_note_week_${viewWeek}`, noteInput.trim());
                      setCommissionerNote(noteInput.trim());
                      setEditingNote(false);
                      showToast("Note saved ✅");
                    }}>Save Note</button>
                    <button style={{...S.btn(C.surface,C.muted),border:`1px solid ${C.border}`,flex:1}} onClick={()=>{setNoteInput(commissionerNote);setEditingNote(false);}}>Cancel</button>
                  </div>
                </>
              ):(
                <>
                  {commissionerNote?(
                    <div style={{background:C.bg,border:`1px solid ${C.border}`,borderRadius:8,padding:"10px 12px",fontSize:13,color:C.text,marginBottom:10,whiteSpace:"pre-wrap"}}>{commissionerNote}</div>
                  ):(
                    <div style={{fontSize:12,color:C.muted,fontStyle:"italic",marginBottom:10}}>No note set for this week.</div>
                  )}
                  <button style={{...S.btn(C.blue,"#fff")}} onClick={()=>setEditingNote(true)}>
                    {commissionerNote?"Edit Note":"+ Add Note"}
                  </button>
                </>
              )}
            </div>

            {/* Admin PIN reset */}
            <div style={S.card}>
              <div style={{fontWeight:800,fontSize:14,marginBottom:12,color:C.silver}}>ADMIN PIN</div>
              {editingAdminPin?(
                <>
                  <label style={{fontSize:11,color:C.muted,display:"block",marginBottom:6}}>NEW 6-DIGIT PIN</label>
                  <input
                    type="tel" inputMode="numeric" maxLength={6}
                    value={newAdminPin1}
                    onChange={e=>{setNewAdminPin1(e.target.value.replace(/\D/g,"").slice(0,6));setAdminPinErr("");}}
                    style={S.input}
                    placeholder="6 digits"
                  />
                  <label style={{fontSize:11,color:C.muted,display:"block",margin:"10px 0 6px"}}>CONFIRM NEW PIN</label>
                  <input
                    type="tel" inputMode="numeric" maxLength={6}
                    value={newAdminPin2}
                    onChange={e=>{setNewAdminPin2(e.target.value.replace(/\D/g,"").slice(0,6));setAdminPinErr("");}}
                    style={S.input}
                    placeholder="Re-enter 6 digits"
                  />
                  {adminPinErr&&<div style={S.error}>{adminPinErr}</div>}
                  <div style={{display:"flex",gap:8,marginTop:10}}>
                    <button style={{...S.btn(C.green,"#fff"),flex:1}} onClick={async()=>{
                      if(newAdminPin1.length!==6){setAdminPinErr("Must be 6 digits.");return;}
                      if(newAdminPin1!==newAdminPin2){setAdminPinErr("PINs don't match.");return;}
                      const pinRes=await rpc("admin_change_pin",{p_pin:_adminPin,p_new_pin:newAdminPin1});
                      if(!pinRes||!pinRes.ok){setAdminPinErr("Couldn't save. Try again.");return;}
                      setAdminSessionPin(newAdminPin1);
                      setEditingAdminPin(false);
                      setNewAdminPin1("");setNewAdminPin2("");setAdminPinErr("");
                      showToast("Admin PIN updated ✅");
                    }}>Save New PIN</button>
                    <button style={{...S.btn(C.surface,C.muted),border:`1px solid ${C.border}`,flex:1}} onClick={()=>{
                      setEditingAdminPin(false);setNewAdminPin1("");setNewAdminPin2("");setAdminPinErr("");
                    }}>Cancel</button>
                  </div>
                </>
              ):(
                <>
                  <div style={{fontSize:12,color:C.muted,marginBottom:10}}>Current PIN is 6 digits. Change it any time — takes effect immediately.</div>
                  <button style={{...S.btn(C.blue,"#fff")}} onClick={()=>setEditingAdminPin(true)}>Reset Admin PIN</button>
                </>
              )}
            </div>

            {/* Season controls */}
            <div style={S.card}>
              <div style={{fontWeight:800,fontSize:14,marginBottom:12,color:C.silver}}>SEASON CONTROLS</div>
              <div style={{display:"flex",gap:8,marginBottom:8}}>
                <button style={{...S.btn(C.accent),flex:1,padding:11,fontSize:13}} onClick={advanceWeek}>
                  Advance to Week {currentWeek+1}
                </button>
              </div>
              <button style={{...S.btn("#1e2d48","#d0ddf0"),border:`1px solid ${C.border}`,fontSize:13}} onClick={async()=>{
                setFetchingScores(true);
                // Clear the once-a-day guard so lines are fetched now. Games that have already
                // kicked off keep their frozen lines (see fetchAndCacheOdds).
                await dbSet(ODDS_LAST_FETCH_KEY+"_w"+viewWeek,0);
                await loadGames(viewWeek,viewWeek===currentWeek);
                setFetchingScores(false);
                showToast("Refreshing lines — give it a few seconds");
              }}>
                {fetchingScores?"Refreshing…":"🔄 Refresh Week "+viewWeek+" Lines"}
              </button>
              <button style={{...S.btn("#1e2d48","#d0ddf0"),border:`1px solid ${C.border}`,fontSize:13,marginTop:8}} onClick={()=>rescoreWeek(viewWeek)}>
                🧮 Re-score Week {viewWeek}
              </button>
            </div>

            {/* ESPN Test */}
            <div style={S.card}>
              <div style={{fontWeight:800,fontSize:14,marginBottom:4,color:C.silver}}>ESPN SCORE TEST</div>
              <div style={{fontSize:12,color:C.muted,marginBottom:10}}>Test auto-score pull for any week.</div>
              <button style={{...S.btn(C.blue),fontSize:13}} onClick={async()=>{
                setEspnTestLog(["Fetching Week "+viewWeek+" scores…"]);
                setEspnTesting(true);
                const scores=await fetchESPNScores(viewWeek, viewGames);
                setEspnTesting(false);
                if(!scores||scores.length===0){setEspnTestLog(l=>[...l,"❌ No scores returned."]);return;}
                setEspnTestLog(l=>[...l,"✅ "+scores.length+" games:"]);
                scores.forEach(s=>{
                  const g=viewGames.find(x=>x.id===s.id);
                  const name=g?`${g.away} @ ${g.home}`:`Game ${s.id}`;
                  const r=g?calcResult(g,s.homeScore,s.awayScore):{};
                  setEspnTestLog(l=>[...l,`${s.status==="final"?"✓":"·"} ${name}: ${s.awayScore!=null?s.awayScore+"-"+s.homeScore:"no score"} → spread:${r.spread||"—"} total:${r.total||"—"}`]);
                });
              }} disabled={espnTesting}>
                {espnTesting?"Testing…":"Run ESPN Test (Week "+viewWeek+")"}
              </button>
              {espnTestLog.length>0&&(
                <div style={{background:C.bg,borderRadius:8,padding:12,fontFamily:"monospace",fontSize:11,lineHeight:1.8,marginTop:10}}>
                  {espnTestLog.map((line,i)=>(
                    <div key={i} style={{color:line.startsWith("✅")||line.startsWith("  ✓")?C.green:line.startsWith("❌")?C.accent:C.muted}}>{line||" "}</div>
                  ))}
                </div>
              )}
            </div>

            {/* Roster */}
            <div style={S.card}>
              <div style={{fontWeight:800,fontSize:14,marginBottom:12,color:C.silver}}>PLAYER ROSTER</div>
              <div style={{marginBottom:14}}>
                <label style={{fontSize:11,color:C.muted,display:"block",marginBottom:6,letterSpacing:1}}>ADD PLAYER</label>
                <div style={{display:"flex",gap:8,marginBottom:8}}>
                  <input style={{...S.input,flex:2}} placeholder="Name" value={newPlayerName} onChange={e=>setNewPlayerName(e.target.value)}/>
                  <input style={{...S.input,flex:1}} placeholder="PIN" type="password" maxLength={4} value={newPlayerPin} onChange={e=>setNewPlayerPin(e.target.value.replace(/\D/g,"").slice(0,4))}/>
                </div>
                <button style={S.btn(C.green,"#fff")} onClick={async()=>{
                  const name=newPlayerName.trim();
                  if(!name||newPlayerPin.length!==4){showToast("Enter name and 4-digit PIN.");return;}
                  const existing=await dbGetRoster();
                  if(existing.find(p=>p.name.toLowerCase()===name.toLowerCase())){showToast(`${name} already exists.`);return;}
                  const updated=[...existing,{name,pin:newPlayerPin}];
                  const addedOk=await dbAddPlayer(name, newPlayerPin);
                  if(!addedOk){showToast("Couldn't add player. Try again.");return;}
                  setRoster(updated);
                  setNewPlayerName("");setNewPlayerPin("");
                  showToast(`${name} added ✅`);
                }}>+ Add Player</button>
              </div>
              <div style={{fontSize:11,color:C.muted,marginBottom:8,letterSpacing:1}}>ROSTER ({roster.length})</div>
              {roster.map((p,i)=>(
                <div key={p.name} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 12px",background:C.bg,borderRadius:8,marginBottom:6,border:`1px solid ${C.border}`}}>
                  <AvatarCircle name={p.name} photo={avatarMap[p.name]||null} size={34}/>
                  <div style={{flex:1}}>
                    <div style={{fontWeight:700,fontSize:14}}>{p.name}</div>
                    <div style={{fontSize:11,color:C.muted}}>PIN: <span style={{fontWeight:700,letterSpacing:2,color:C.silver}}>{p.pin}</span></div>
                  </div>
                  <div style={{display:"flex",gap:6}}>
                    <InlineReset name={p.name} roster={roster} setRoster={setRoster} showToast={showToast} C={C} storageSet={storageSet} storageSaveNow={storageSaveNow}/>
                    <button onClick={async()=>{
                      const updated=roster.filter((_,idx)=>idx!==i);
                      const removedOk=await dbRemovePlayer(p.name);
                      if(!removedOk){showToast("Couldn't remove. Try again.");return;}
                      setRoster(updated);
                      showToast(`${p.name} removed.`);
                    }} style={{background:"#2a0a0a",border:`1px solid ${C.accent}`,color:C.accent,borderRadius:6,padding:"5px 10px",fontSize:12,cursor:"pointer",fontWeight:700}}>
                      Remove
                    </button>
                  </div>
                </div>
              ))}
            </div>

            {/* Scoring rules */}
            <div style={S.card}>
              <div style={{fontWeight:800,fontSize:14,marginBottom:10,color:C.silver}}>SCORING RULES</div>
              {[["Regular pick correct","1 pt"],["Mortal Lock correct","2 pts"],["Regular push","0.5 pts"],["Mortal Lock push","1 pt"],["Wrong","0 pts"]].map(([r,p])=>(
                <div key={r} style={{display:"flex",justifyContent:"space-between",padding:"6px 0",borderBottom:`1px solid ${C.border}`,fontSize:13}}>
                  <span style={{color:C.muted}}>{r}</span>
                  <span style={{color:C.gold,fontWeight:700}}>{p}</span>
                </div>
              ))}
            </div>

            <div style={{textAlign:"center",padding:"16px 0 4px",fontSize:11,color:C.muted}}>v{VERSION}</div>
          </div>
        )}

        {toast&&<div style={S.toast}>{toast}</div>}
      </div>
    );
  }

  return null;
}


    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App/>);
  </script>
</body>
</html>
