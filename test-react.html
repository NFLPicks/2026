// picks shape: { [gameId]: { spread?: "spread_away"|"spread_home", total?: "over"|"under" } }
// mortalLock shape: { gameId, slot: "spread"|"total" } | null

function countPicks(picks) {
  return Object.values(picks).reduce((acc, g) => acc + (g.spread ? 1 : 0) + (g.total ? 1 : 0), 0);
}

function flatPicks(picks) {
  // returns [{ gameId, slot, value }]
  const out = [];
  Object.entries(picks).forEach(([gid, g]) => {
    if (g.spread) out.push({ gameId: gid, slot: "spread", value: g.spread });
    if (g.total)  out.push({ gameId: gid, slot: "total",  value: g.total });
  });
  return out;
}

// ── Storage ──────────────────────────────────────────────────────────────────
// ── JSONBin Storage Layer ────────────────────────────────────────────────────
// All app data lives in a single JSONBin bin as one JSON object.
// Structure: { roster, current_week, standings, games_week_N, 
//              all_picks_week_N, all_mortals_week_N, results_week_N,
//              picks_NAME_week_N, avatars }

const JSONBIN_BASE = "https://api.jsonbin.io/v3/b";
let _binId = null;        // set after first create or from config
let _apiKey = null;       // set by user
let _cache = null;        // in-memory cache of full bin data
let _dirty = false;       // true if cache has unsaved changes
let _saveTimer = null;    // debounce timer for saves

function setJsonBinConfig(apiKey, binId) {
  _apiKey = apiKey;
  _binId = binId;
}

// Load entire bin into cache
async function loadBin() {
  if (!_apiKey || !_binId) return null;
  try {
    const r = await fetch(`${JSONBIN_BASE}/${_binId}/latest?t=${Date.now()}`, {
      headers: {
        "X-Master-Key": _apiKey,
        "X-Bin-Meta": "false",
        "Cache-Control": "no-cache, no-store",
        "Pragma": "no-cache",
      }
    });
    if (!r.ok) {
      const txt = await r.text();
      console.error("loadBin HTTP error:", r.status, txt);
      return _cache;
    }
    const data = await r.json();
    _cache = data.record || data; // JSONBin wraps in {record:...} sometimes
    return _cache;
  } catch(e) {
    console.error("loadBin failed:", e);
    return _cache;
  }
}

// Save entire cache to bin
async function saveBin(immediate=false) {
  if (!_apiKey || !_binId || !_cache) return false;
  const doSave = async () => {
    try {
      // Always cancel any pending debounce when doing a real save
      if (_saveTimer) { clearTimeout(_saveTimer); _saveTimer = null; }
      const r = await fetch(`${JSONBIN_BASE}/${_binId}`, {
        method: "PUT",
        headers: {
          "Content-Type": "application/json",
          "X-Master-Key": _apiKey,
          "X-Bin-Versioning": "false",
        },
        body: JSON.stringify(_cache)
      });
      if (!r.ok) {
        const txt = await r.text();
        console.error("saveBin HTTP error:", r.status, txt);
        return false;
      }
      _dirty = false;
      console.log("saveBin success, roster:", JSON.stringify(_cache.roster));
      return true;
    } catch(e) {
      console.error("saveBin failed:", e);
      return false;
    }
  };
  if (immediate) return doSave();
  // Debounce: wait 1500ms, then save
  if (_saveTimer) clearTimeout(_saveTimer);
  _saveTimer = setTimeout(doSave, 1500);
  return true;
}

// Create a new bin (first-time setup)
async function createBin(apiKey) {
  try {
    const r = await fetch(JSONBIN_BASE, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-Master-Key": apiKey,
        "X-Bin-Name": "nfl-pickem",
        "X-Bin-Private": "true",
      },
      body: JSON.stringify({ current_week: 1, roster: [], standings: [] })
    });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const data = await r.json();
    return data.metadata?.id || null;
  } catch(e) {
    console.error("createBin failed:", e);
    return null;
  }
}

// Drop-in replacements for old storageGet/storageSet
async function storageGet(key) {
  if (!_cache) await loadBin();
  if (!_cache) return null;
  const val = _cache[key];
  return val !== undefined ? val : null;
}

async function storageSet(key, val) {
  // Always ensure we have a full cache before writing
  // to avoid wiping other keys
  if (!_cache || Object.keys(_cache).length === 0) {
    await loadBin();
  }
  if (!_cache) _cache = {};
  _cache[key] = val;
  _dirty = true;
  // Don't debounce - caller will call storageSaveNow() for critical ops
  // but schedule a backup save in case they don't
  if (_saveTimer) clearTimeout(_saveTimer);
  _saveTimer = setTimeout(()=>saveBin(true), 1500);
  return true;
}

// Force immediate save (call before critical operations)
async function storageSaveNow() {
  return saveBin(true);
}

// ── ESPN fetch ────────────────────────────────────────────────────────────────
async function fetchNFLGames(week) {
  try {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        model:"claude-sonnet-4-6", max_tokens:1500,
        tools:[{type:"web_search_20250305",name:"web_search"}],
        messages:[{role:"user",content:`Search ESPN for the 2026 NFL Season Week ${week} schedule and betting odds. Search for "2026 NFL Week ${week} odds lines spreads" and "ESPN NFL Week ${week} 2026 schedule". Return ONLY a valid JSON array with no markdown. Each object:
- id: "w${week}g1" etc
- home, away: full team name (e.g. "Eagles", "Chiefs", "49ers")  
- homeAbbr, awayAbbr: ESPN abbr (PHI, KC, SF, SEA, NE, DAL, BAL, BUF, MIA, GB, DET, LAR, ARI, NYJ, CIN, PIT, MIN, CHI, NO, ATL, HOU, TEN, IND, JAX, LV, LAC, DEN, CLE, TB, CAR, NYG, WSH)
- spread: "TEAM LINE" format e.g. "SEA -3.5" or "PIT -3" or "EVEN" — null if unavailable
- total: "O/U 44.5" format — null if unavailable
- kickoff: ISO 8601 in ET e.g. "2026-09-10T20:20:00-04:00"
- dateLabel: "Thu Sep 10 · 8:20 PM ET"
- status: "upcoming" or "final"
- homeScore: number or null
- awayScore: number or null
Return ONLY the JSON array.`}]
      })
    });
    const data=await res.json();
    const text=data.content.map(b=>b.type==="text"?b.text:"").join("");
    const clean=text.replace(/```json|```/g,"").trim();
    const s=clean.indexOf("["),e=clean.lastIndexOf("]");
    if(s!==-1&&e!==-1) return JSON.parse(clean.slice(s,e+1));
    return null;
  } catch { return null; }
}

async function fetchESPNScores(week) {

      })
    });
    const data=await res.json();
    const text=data.content.map(b=>b.type==="text"?b.text:"").join("");
    const clean=text.replace(/```json|```/g,"").trim();
    const s=clean.indexOf("["),e=clean.lastIndexOf("]");
    if(s!==-1&&e!==-1) return JSON.parse(clean.slice(s,e+1));
    return null;
  } catch(err) { return null; }
}

function calcResult(game, homeScore, awayScore) {
  const out = {};
  if (homeScore==null || awayScore==null) return out;
  if (game.spread) {
    const m = game.spread.match(/[-+]?[0-9]+\.?[0-9]*/);
    const val = m ? parseFloat(m[0]) : NaN;
    const favHome = game.spread.includes(game.home);
    if (!isNaN(val)) {
      const margin = homeScore - awayScore;
      const adj = favHome ? margin + val : margin - val;
      if (Math.abs(adj) < 0.01) out.spread = "push_spread";
      else if (adj > 0) out.spread = favHome ? "spread_home" : "spread_away";
      else out.spread = favHome ? "spread_away" : "spread_home";
    }
  }
  if (game.total) {
    const tv = parseFloat(game.total.replace("O/U ",""));
    if (!isNaN(tv)) {
      const sum = homeScore + awayScore;
      if (Math.abs(sum - tv) < 0.01) out.total = "push_total";
      else out.total = sum > tv ? "over" : "under";
    }
  }
  return out;
}

// Build a game ID for each game
function buildScheduleWeek(week) {
  const games = NFL_SCHEDULE[week];
  if (!games) return null;
  return games.map((g, i) => ({
    id: `w${week}g${i+1}`,
    home: g.home, away: g.away,
    homeAbbr: g.homeAbbr, awayAbbr: g.awayAbbr,
    kickoff: g.kickoff, dateLabel: g.dateLabel,
    spread: g.spread || null,  // use opening line from schedule as seed
    total: g.total || null,    // Odds API will update with current line
    status: "upcoming", homeScore: null, awayScore: null,
  }));
}

// ── Odds API ──────────────────────────────────────────────────────────────────
const ODDS_API_KEY = "293bc28ee22c199a6e2f04555b5b710f";
const ODDS_LAST_FETCH_KEY = "odds_last_fetch";

async function fetchAndCacheOdds(games, week) {
  // Only fetch once per 24 hours
  const lastFetch = await storageGet(ODDS_LAST_FETCH_KEY + "_w" + week);
  const now = Date.now();
  if (lastFetch && (now - lastFetch) < 23 * 60 * 60 * 1000) {
    console.log("Odds fresh, skipping fetch. Next in", Math.round((23*3600000-(now-lastFetch))/3600000), "hrs");
    return games;
  }

  try {
    const url = `https://api.the-odds-api.com/v4/sports/americanfootball_nfl/odds?apiKey=${ODDS_API_KEY}&regions=us&markets=spreads,totals&oddsFormat=american`;
    const res = await fetch(url);
    if (!res.ok) { console.error("Odds API error:", res.status); return games; }
    const oddsData = await res.json();

    // Match odds to our schedule by team names
    const updatedGames = games.map(game => {
      const match = oddsData.find(o => {
        const h = o.home_team?.toLowerCase() || "";
        const a = o.away_team?.toLowerCase() || "";
        return (h.includes(game.home.toLowerCase()) || game.home.toLowerCase().includes(h.split(" ").pop())) &&
               (a.includes(game.away.toLowerCase()) || game.away.toLowerCase().includes(a.split(" ").pop()));
      });
      if (!match) return game;

      let spread = null, total = null;
      for (const bm of (match.bookmakers || [])) {
        for (const mkt of (bm.markets || [])) {
          if (mkt.key === "spreads" && !spread) {
            const homeOut = mkt.outcomes?.find(o => o.name === match.home_team);
            if (homeOut) {
              const line = homeOut.point;
              spread = line < 0 ? `${game.home} ${line}` : `${game.away} ${-line}`;
            }
          }
          if (mkt.key === "totals" && !total) {
            const over = mkt.outcomes?.find(o => o.name === "Over");
            if (over) total = `O/U ${over.point}`;
          }
        }
        if (spread && total) break;
      }
      return { ...game, spread, total };
    });

    // Cache updated games and timestamp
    await storageSet(`games_week_${week}`, updatedGames);
    await storageSet(ODDS_LAST_FETCH_KEY + "_w" + week, now);
    console.log("Odds fetched and cached for Week", week);
    return updatedGames;
  } catch(e) {
    console.error("fetchAndCacheOdds failed:", e);
    return games;
  }
}

// ── Scoring ──────────────────────────────────────────────────────────────────
// picks: { gameId: { spread?, total? } }
// mortalLock: { gameId, slot } | null
// results: { gameId: "spread_away"|"spread_home"|"push_spread"|"over"|"under"|"push_total" }
function scoreUser(picks, mortalLock, results) {
  let total=0;
  const breakdown={};
  Object.entries(picks).forEach(([gid,gamePick])=>{
    ["spread","total"].forEach(slot=>{
      const pick=gamePick[slot];
      if(!pick) return;
      // Support both flat string results (legacy) and {spread,total} object results
      const gameResult=results[gid];
      const res=gameResult&&typeof gameResult==="object"?gameResult[slot]:gameResult;
      if(res==null) return;
      const key=`${gid}:${slot}`;
      const isMortal=mortalLock&&mortalLock.gameId===gid&&mortalLock.slot===slot;
      const mult=isMortal?2:1;
      let pts=0;
      if(slot==="spread"&&pick===res) pts=1*mult;
      else if(slot==="total"&&pick===res) pts=1*mult;
      else if(slot==="spread"&&res==="push_spread") pts=0.5*mult;
      else if(slot==="total"&&res==="push_total") pts=0.5*mult;
      breakdown[key]=pts;
      total+=pts;
    });
  });
  return {total,breakdown};
}

function isGameLocked(game) {
  if(!game.kickoff) return false;
  try{return new Date()>=new Date(game.kickoff);}catch{return false;}
}

// Theme helper — reads system preference, can be overridden
function getSystemTheme(){ return window.matchMedia&&window.matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"; }

function makeColors(dark){
  return dark ? {
    bg:"#0b0f1f", surface:"#111827", surfaceHigh:"#1a2440",
    border:"#1e2d4e", red:"#cc1d2b", redDim:"#7a1018",
    blue:"#0a3fa8", blueBright:"#1e6fff", silver:"#c8d0e0",
    gold:"#d4a017", green:"#22c55e", pushBlue:"#60a5fa",
    muted:"#3d5278", text:"#eef2ff", textDim:"#7a90b8",
  } : {
    bg:"#f4f5f9", surface:"#ffffff", surfaceHigh:"#eaecf4",
    border:"#d0d8e8", red:"#cc1d2b", redDim:"#f5c0c3",
    blue:"#0a3fa8", blueBright:"#1e6fff", silver:"#0b0f1f",
    gold:"#b8860b", green:"#16a34a", pushBlue:"#2563eb",
    muted:"#7080a0", text:"#0b0f1f", textDim:"#3d5278",
  };
}
// C is set dynamically in App — default dark for module-level usage
const C=makeColors(true);
function makeStyles(C){return {
  app:{minHeight:"100vh",background:C.bg,color:C.text,fontFamily:"'Inter',sans-serif",paddingBottom:140},
  header:{
    background:C.bg==="#f0f2f8"?`linear-gradient(135deg,#cc1d2b 0%,#a01020 100%)`:`linear-gradient(135deg,#0d1530 0%,#0b1428 50%,#10082a 100%)`,
    borderBottom:`3px solid ${C.red}`,
    padding:"13px 18px",display:"flex",alignItems:"center",justifyContent:"space-between",
    position:"sticky",top:0,zIndex:10,
    boxShadow:`0 2px 20px rgba(204,29,43,0.25)`,
  },
  logo:{fontSize:17,fontWeight:900,letterSpacing:3,color:"#ffffff",display:"flex",alignItems:"center",gap:8},
  weekBadge:{background:C.red,color:"#ffffff",fontWeight:800,fontSize:11,padding:"3px 11px",borderRadius:20,letterSpacing:1},
  card:{background:C.surface,border:`1px solid ${C.border}`,borderRadius:12,padding:"16px 18px",margin:"10px 14px"},

// Parse spread string and return { favored, line, awayLine, homeLine }
// e.g. "Eagles -3.5" -> { favored:"home", line:3.5, awayLine:"+3.5", homeLine:"-3.5" }
// e.g. "EVEN" -> { favored:null, line:0, awayLine:"EVEN", homeLine:"EVEN" }
function parseSpread(game){
  if(!game.spread) return null;
  const s = game.spread.trim();
  if(s.toUpperCase()==="EVEN") return {favored:null,line:0,awayLine:"EVEN",homeLine:"EVEN"};
  const match = s.match(/^(.+?)\s+([+-]?\d+\.?\d*)$/);
  if(!match) return {favored:null,line:0,awayLine:s,homeLine:s};
  const teamPart = match[1].trim();
  const lineVal = parseFloat(match[2]);
  const favoredHome = game.home.toLowerCase().includes(teamPart.toLowerCase()) ||
                      teamPart.toLowerCase().includes(game.home.toLowerCase().split(" ").pop());
  const favLine = lineVal < 0 ? lineVal : -lineVal; // favorite always negative
  const dogLine = -favLine;
  const fmt = (n) => n > 0 ? `+${n}` : `${n}`;
  return {
    favored: favoredHome ? "home" : "away",
    line: Math.abs(lineVal),
    awayLine: favoredHome ? fmt(dogLine) : fmt(favLine),
    homeLine: favoredHome ? fmt(favLine) : fmt(dogLine),
  };
}

function slotLabel(game,slot,value){
  if(!value||!game) return "";
  if(value==="spread_away") return `${game.away} ${game.spread?.includes(game.away)?game.spread.split(" ").pop():"ATS"}`;
  if(value==="spread_home") return `${game.home} ${game.spread?.includes(game.home)?game.spread.split(" ").pop():"ATS"}`;
  if(value==="over") return `OVER ${game.total?.replace("O/U ","")}`;
  if(value==="under") return `UNDER ${game.total?.replace("O/U ","")}`;
  return value;
}

// ── Game card ─────────────────────────────────────────────────────────────────
function GameCard({game,gamePick={},onPick,disabled,C}){  // C passed from App
  const locked=isGameLocked(game);
  const effectiveDisabled=disabled||locked;
  const awayAbbr=game.awayAbbr||TEAM_ABBR[game.away];
  const homeAbbr=game.homeAbbr||TEAM_ABBR[game.home];
  const awayColor=TEAM_COLORS[awayAbbr]||"#1a2440";
  const homeColor=TEAM_COLORS[homeAbbr]||"#1a2440";
  const hasSpread=!!game.spread;
  const hasTotal=!!game.total;
  const hasPick=!!(gamePick.spread||gamePick.total);
  const isDarkMode=C.bg!=="#f4f5f9";
  const sp=parseSpread(game);

  // Card colors
  const cardBg = isDarkMode
    ? hasPick ? "#111e35" : "#111827"
    : hasPick ? "#e8eef8" : "#ffffff";
  const cardBorder = isDarkMode
    ? hasPick ? "#2a4a7a" : "#1e2d4e"
    : hasPick ? "#99b0d8" : "#d0d8e8";

  // Button styles - pill shaped
  const btnBase = {
    flex:1, padding:"11px 8px", borderRadius:50,
    fontSize:13, fontWeight:700, cursor:"pointer",
    transition:"all 0.15s", border:"2px solid",
    fontFamily:"inherit",
  };
  const spreadAwayActive = gamePick.spread==="spread_away";
  const spreadHomeActive = gamePick.spread==="spread_home";
  const overActive = gamePick.total==="over";
  const underActive = gamePick.total==="under";

  // Color scheme: away=green, home=red, over=blue, under=orange
  const COLOR_AWAY  = "#22c55e";
  const COLOR_HOME  = "#cc1d2b";
  const COLOR_OVER  = "#1e6fff";
  const COLOR_UNDER = "#f97316";

  const activeBtnStyle = (color) => ({
    ...btnBase,
    background:color,
    color:"#ffffff",
    borderColor:color,
    boxShadow:`0 2px 12px ${color}66`,
  });
  const inactiveBtnStyle = {
    ...btnBase,
    background:"transparent",
    color:isDarkMode?"#d0ddf0":"#2a3a58",
    borderColor:isDarkMode?"#3a4f72":"#b8c8e0",
  };

  return(
    <div style={{
      background:cardBg,
      border:`1px solid ${cardBorder}`,
      borderRadius:14,
      margin:"8px 14px",
      overflow:"hidden",
      opacity:locked&&!hasPick?0.6:1,
      transition:"all 0.15s",
      position:"relative",
      boxShadow:hasPick
        ? isDarkMode?"0 4px 16px rgba(30,80,180,0.2)":"0 4px 16px rgba(30,80,180,0.1)"
        : isDarkMode?"0 2px 8px rgba(0,0,0,0.3)":"0 2px 8px rgba(0,0,0,0.06)",
    }}>
      {locked&&(
        <div style={{position:"absolute",top:0,left:14,background:C.red,color:"#fff",fontSize:9,fontWeight:800,padding:"2px 8px",borderRadius:"0 0 6px 6px",letterSpacing:1}}>
          LOCKED
        </div>
      )}

      {/* Team banner */}
      <div style={{display:"flex",height:58}}>
        <div style={{
          flex:1,
          background:`linear-gradient(135deg,${awayColor}ee,${awayColor}88)`,
          display:"flex",alignItems:"center",gap:10,padding:"0 14px",
        }}>
          <TeamLogo abbr={awayAbbr} size={30}/>
          <span style={{fontWeight:800,fontSize:14,color:"#ffffff",textShadow:"0 1px 3px rgba(0,0,0,0.4)"}}>{game.away}</span>
        </div>
        <div style={{
          width:34,display:"flex",alignItems:"center",justifyContent:"center",
          background:isDarkMode?"#0d1220":"#dde5f0",
          fontSize:12,color:C.muted,fontWeight:700,flexShrink:0,
        }}>@</div>
        <div style={{
          flex:1,
          background:`linear-gradient(225deg,${homeColor}ee,${homeColor}88)`,
          display:"flex",alignItems:"center",justifyContent:"flex-end",gap:10,padding:"0 14px",
        }}>
          <span style={{fontWeight:800,fontSize:14,color:"#ffffff",textShadow:"0 1px 3px rgba(0,0,0,0.4)"}}>{game.home}</span>
          <TeamLogo abbr={homeAbbr} size={30}/>
        </div>
      </div>

      {/* Card body */}
      <div style={{padding:"12px 14px 14px"}}>
        {/* Date + spread label row */}
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
          <span style={{fontSize:11,fontWeight:700,color:isDarkMode?"#8090b0":"#6070a0",letterSpacing:0.3}}>
            {game.dateLabel?.toUpperCase()}
          </span>
          {hasPick&&!locked&&<span style={{fontSize:10,color:C.green,fontWeight:700}}>✓ PICKED</span>}
          {hasPick&&locked&&<span style={{fontSize:10,color:C.red,fontWeight:700}}>🔒 LOCKED</span>}
        </div>

        {!hasSpread&&!hasTotal&&(
          <div style={{fontSize:12,color:C.muted,fontStyle:"italic",textAlign:"center",padding:"8px 0"}}>Lines not yet available</div>
        )}

        {/* Spread */}
        {hasSpread&&(
          <div style={{marginBottom:10}}>
            <div style={{fontSize:10,fontWeight:800,color:isDarkMode?"#8090b0":"#5060a0",letterSpacing:1,marginBottom:6}}>
              SPREAD · {game.spread}
            </div>
            <div style={{display:"flex",gap:8}}>
              <button
                style={spreadAwayActive?activeBtnStyle(COLOR_AWAY):inactiveBtnStyle}
                onClick={()=>!effectiveDisabled&&onPick?.(game.id,"spread","spread_away")}
                disabled={effectiveDisabled}>
                {game.away} {sp?.awayLine||""}
              </button>
              <button
                style={spreadHomeActive?activeBtnStyle(COLOR_HOME):inactiveBtnStyle}
                onClick={()=>!effectiveDisabled&&onPick?.(game.id,"spread","spread_home")}
                disabled={effectiveDisabled}>
                {game.home} {sp?.homeLine||""}
              </button>
            </div>
          </div>
        )}

        {/* Total */}
        {hasTotal&&(
          <div>
            <div style={{fontSize:10,fontWeight:800,color:isDarkMode?"#8090b0":"#5060a0",letterSpacing:1,marginBottom:6}}>
              TOTAL · {game.total}
            </div>
            <div style={{display:"flex",gap:8}}>
              <button
                style={overActive?activeBtnStyle(COLOR_OVER):inactiveBtnStyle}
                onClick={()=>!effectiveDisabled&&onPick?.(game.id,"total","over")}
                disabled={effectiveDisabled}>
                Over {game.total?.replace("O/U ","")||""}
              </button>
              <button
                style={underActive?activeBtnStyle(COLOR_UNDER):inactiveBtnStyle}
                onClick={()=>!effectiveDisabled&&onPick?.(game.id,"total","under")}
                disabled={effectiveDisabled}>
                Under {game.total?.replace("O/U ","")||""}
              </button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}
